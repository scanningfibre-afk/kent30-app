/* ═══════════════════════════════════════════════════════════════════════════
   PICKER HOME SCREEN
══════════════════════════════════════════════════════════════════════════ */
function PickerHome({ session, onAddStock, onRemoveStock, onInbound, onMoveStock, onPickOrder, products, locations, floorStock }) {
  const [removeOpen, setRemoveOpen] = useState(false);
  const [floorOpen, setFloorOpen] = useState(false);
  const [searchQ, setSearchQ] = useState("");
  const [searchResults, setSearchResults] = useState(null);

  const searchProduct = () => {
    const q = String(searchQ||"").trim();
    if (!q) return;
    const qu = q.toUpperCase();
    // Find product by code, barcode or description
    const prod = (products||[]).find(p =>
      String(p.code||"").toUpperCase() === qu ||
      String(p.barcode||"").trim() === q ||
      String(p.barcode||"").trim() === qu ||
      String(p.description||"").toUpperCase().includes(qu)
    );
    if (!prod) { setSearchResults([]); return; } // keep searchQ so user can see what was scanned
    // Show product info even if no stock
    const results = [];
    Object.values(locations||{}).forEach(loc => {
      (loc.contents||[]).forEach((c) => {
        if (String(c.productCode||"").toUpperCase() === String(prod.code||"").toUpperCase()) {
          results.push({ locId: loc.id, customName: loc.customName||"", isFloor: false, description: c.description||prod.description, bestBefore: c.bestBefore, qty: c.qty });
        }
      });
    });
    Object.entries(floorStock||{}).forEach(([warehouse, items]) => {
      (items||[]).forEach(item => {
        if (String(item.productCode||"").toUpperCase() === String(prod.code||"").toUpperCase()) {
          results.push({ locId: warehouse, customName: warehouse, isFloor: true, description: item.description||prod.description, bestBefore: item.bestBefore, qty: item.qty });
        }
      });
    });
    results.sort((a,b) => (a.bestBefore||"").localeCompare(b.bestBefore||""));
    // If no stock found, show product info with 0 qty
    if (results.length === 0) {
      results.push({ locId: "NO STOCK", customName: "", isFloor: false, description: prod.description, bestBefore: "—", qty: 0, noStock: true });
    }
    setSearchResults(results);
    setSearchQ(""); // clear input after successful search
  };

  return (
    <div style={{ animation: "fadeUp .25s ease" }}>
      {/* Greeting */}
      <div style={{ marginBottom: 32, marginTop: 8 }}>
        <div style={{ color: "#888", fontSize: 15, marginBottom: 2 }}>Good {getGreeting()},</div>
        <div style={{ color: "#fff", fontWeight: 800, fontSize: 30 }}>{session.name}</div>
        <div style={{ color: "#444", fontSize: 13, marginTop: 4 }}>{new Date().toLocaleDateString("en-AU", { weekday: "long", day: "numeric", month: "long" })}</div>
      </div>

      {/* ── FIND PRODUCT ── */}
      <div style={{ background:"#1e1e1e", borderRadius:12, padding:16, marginBottom:16 }}>
        <div style={{ color:"#fff", fontWeight:800, fontSize:16, marginBottom:10, letterSpacing:1 }}>📦 STOCK VIEW</div>
        <div style={{ display:"flex", gap:8 }}>
          <input className="inp-dark" style={{ flex:1, fontSize:15 }}
            placeholder="Scan barcode or type product code…"
            value={searchQ}
            onChange={e => { setSearchQ(e.target.value); if(!e.target.value) setSearchResults(null); }}
            onKeyDown={e => { if(e.key==="Enter") { e.preventDefault(); searchProduct(); } }}
          />
          <button onClick={searchProduct} style={{ background:G.amber, border:"none", borderRadius:8, padding:"0 16px", color:"#fff", fontWeight:800, fontSize:16, cursor:"pointer", minWidth:52 }}>GO</button>
        </div>
        {searchResults !== null && (
          <div style={{ marginTop:12 }}>
            {searchResults.length === 0
              ? <div style={{ color:"#666", fontSize:14, textAlign:"center", padding:"12px 0" }}>No stock found for this product</div>
              : <div style={{ display:"grid", gap:8 }}>
                  <div style={{ fontSize:12, color:G.amber, fontWeight:700, letterSpacing:1 }}>{searchResults.length} RESULT{searchResults.length!==1?"S":""}</div>

                    <div key={i} style={{ background:"#2a2a2a", borderRadius:8, padding:"12px 14px", border:`1px solid ${r.noStock?"#333":r.isFloor?"#4a3a1a":"#1a3a1a"}` }}>
                      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start" }}>
                        <div>
                          <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:4 }}>
                            <span style={{ fontFamily:"monospace", fontWeight:800, fontSize:18, color:r.isFloor?G.amber:G.green }}>{r.locId}</span>
                            {r.customName && r.locId!==r.customName && <span style={{ fontSize:12, color:"#888" }}>{r.customName}</span>}
                            {r.isFloor && <span style={{ background:"#3a2a00", color:G.amber, borderRadius:4, padding:"1px 6px", fontSize:11, fontWeight:700 }}>FLOOR</span>}
                          </div>
                          <div style={{ fontSize:13, color:"#ddd", fontWeight:600 }}>{r.description}</div>
                          <div style={{ marginTop:4 }}><span style={{ fontSize:11, color:"#8a7a4a", fontWeight:700, letterSpacing:1 }}>BB </span><span style={{ fontSize:19, color:G.amber, fontWeight:800 }}>{r.bestBefore||"—"}</span></div>
                        </div>
                        <div style={{ textAlign:"right", flexShrink:0, marginLeft:12 }}>
                          <div style={{ fontWeight:800, fontSize:26, color:"#fff", lineHeight:1 }}>{r.qty}</div>
                          <div style={{ fontSize:11, color:"#888" }}>ctns</div>
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
            }
          </div>
        )}
      </div>

      {/* ── PICK ORDER ── */}
      <button onClick={onPickOrder} style={{ width: "100%", marginBottom: 16, padding: "24px 22px", background: "linear-gradient(135deg,#2a1d00,#4a3400)", border: `2px solid ${G.amber}`, borderRadius: 14, cursor: "pointer", display: "flex", alignItems: "center", gap: 18, textAlign: "left" }}>
        <div style={{ width: 60, height: 60, borderRadius: 14, background: G.amber, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 28, flexShrink: 0 }}>📋</div>
        <div style={{ flex: 1 }}>
          <div style={{ color: "#fff", fontWeight: 800, fontSize: 24, letterSpacing: .5 }}>PICK ORDER</div>
          <div style={{ color: "#d9a93f", fontSize: 14, marginTop: 3 }}>Type invoice no → pick each line → save</div>
        </div>
        <div style={{ color: G.amber, fontSize: 28 }}>›</div>
      </button>

      {/* ── INBOUND ── */}
      <button onClick={onInbound} style={{ width: "100%", marginBottom: 16, padding: "24px 22px", background: "linear-gradient(135deg,#0a1d10,#12341c)", border: "2px solid #78BE20", borderRadius: 14, cursor: "pointer", display: "flex", alignItems: "center", gap: 18, textAlign: "left" }}>
        <div style={{ width: 60, height: 60, borderRadius: 14, background: "#78BE20", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 28, flexShrink: 0 }}>📥</div>
        <div style={{ flex: 1 }}>
          <div style={{ color: "#fff", fontWeight: 800, fontSize: 24, letterSpacing: .5 }}>INBOUND</div>
          <div style={{ color: "#8fce4a", fontSize: 14, marginTop: 3 }}>Receive raw materials & packaging</div>
        </div>
        <div style={{ color: "#78BE20", fontSize: 28 }}>›</div>
      </button>

      {/* ── ADD STOCK ── */}
      <button onClick={onAddStock} style={{ width: "100%", marginBottom: 16, padding: "24px 22px", background: "linear-gradient(135deg,#0d2208,#1a3a10)", border: `2px solid ${G.green}`, borderRadius: 14, cursor: "pointer", display: "flex", alignItems: "center", gap: 18, textAlign: "left" }}>
        <div style={{ width: 60, height: 60, borderRadius: 14, background: G.green, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 30, flexShrink: 0 }}>↓</div>
        <div style={{ flex: 1 }}>
          <div style={{ color: "#fff", fontWeight: 800, fontSize: 24, letterSpacing: .5 }}>STORE</div>
          <div style={{ color: "#6db85a", fontSize: 14, marginTop: 3 }}>Scan product → enter details → scan aisle → select bin</div>
        </div>
        <div style={{ color: G.green, fontSize: 28 }}>›</div>
      </button>

      {/* ── REMOVE STOCK ── */}
      <button onClick={onRemoveStock} style={{ width: "100%", padding: "24px 22px", background: "linear-gradient(135deg,#220808,#3a1010)", border: "2px solid #5a1a1a", borderRadius: 14, cursor: "pointer", display: "flex", alignItems: "center", gap: 18, textAlign: "left" }}>
        <div style={{ width: 60, height: 60, borderRadius: 14, background: G.red, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 30, color: "#fff", flexShrink: 0 }}>↑</div>
        <div style={{ flex: 1 }}>
          <div style={{ color: "#fff", fontWeight: 800, fontSize: 24, letterSpacing: .5 }}>REMOVE STOCK</div>
          <div style={{ color: "#c47070", fontSize: 14, marginTop: 3 }}>Area → scan product → pick batch → remove</div>
        </div>
        <div style={{ color: G.red, fontSize: 28 }}>›</div>
      </button>

      {/* ── MOVE STOCK ── */}
      <button onClick={onMoveStock} style={{ width: "100%", marginTop: 16, padding: "24px 22px", background: "linear-gradient(135deg,#0a0d22,#141a3a)", border: `2px solid #4a6adf`, borderRadius: 14, cursor: "pointer", display: "flex", alignItems: "center", gap: 18, textAlign: "left" }}>
        <div style={{ width: 60, height: 60, borderRadius: 14, background: "#3a50cc", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 28, color: "#fff", flexShrink: 0 }}>⇄</div>
        <div style={{ flex: 1 }}>
          <div style={{ color: "#fff", fontWeight: 800, fontSize: 24, letterSpacing: .5 }}>MOVE STOCK</div>
          <div style={{ color: "#7a9aee", fontSize: 14, marginTop: 3 }}>Aisle → Aisle · Aisle → Floor · Floor → Aisle</div>
        </div>
        <div style={{ color: "#4a6adf", fontSize: 28 }}>›</div>
      </button>
    </div>
  );
}

function getGreeting() {
  const h = new Date().getHours();
  return h < 12 ? "morning" : h < 17 ? "afternoon" : "evening";
}

/* ═══════════════════════════════════════════════════════════════════════════
   PICK ORDER FLOW
   1. Type invoice no → order is claimed for this picker
   2. Line list — tap a line to pick it
   3. Pick screen — oldest best-before first, override allowed
   Short picks are fine: record what's there and move on. SAVE & EXIT
   releases the lock so anyone can finish the order tomorrow.
══════════════════════════════════════════════════════════════════════════ */
function PickOrderFlow({ session, products, locations, setLocations, floorStock, setFloorStock, addLog, showToast, onDone, skipNextSync }) {
  const [step, setStep]         = useState("enter");   // enter | lines | pick | done
  const [invoiceIn, setInvoiceIn] = useState("");
  const [order, setOrder]       = useState(null);      // { invoiceNo, customer, dueDate, customerPO, lines[] }
  const [activeKey, setActiveKey] = useState(null);
  const [srcIdx, setSrcIdx]     = useState(0);
  const [qty, setQty]           = useState("");
  const [error, setError]       = useState("");
  const [busy, setBusy]         = useState(false);
  const [blocking, setBlocking] = useState(false);
  const [blockReason, setBlockReason] = useState("");
  const invRef = useRef(null);

  useEffect(() => { if (step === "enter") setTimeout(() => invRef.current?.focus(), 80); }, [step]);

  /* Release the lock if the picker walks away with the back arrow */
  const orderRef = useRef(null);
  useEffect(() => { orderRef.current = order; }, [order]);
  useEffect(() => () => {
    const o = orderRef.current;
    if (o && GS.configured()) GS.releaseOrder(o.invoiceNo, session.username).catch(() => {});
  }, [session.username]);

  const activeLine = order?.lines?.find(l => l.lineKey === activeKey) || null;

  /* ── Every place this product is sitting, oldest best-before first ── */
  const sources = React.useMemo(() => {
    if (!activeLine) return [];
    const code = String(activeLine.partNo || "").toUpperCase();
    const out = [];
    Object.values(locations || {}).forEach(loc => {
      (loc.contents || []).forEach((c, i) => {
        if (String(c.productCode || "").toUpperCase() === code && c.qty > 0)
          out.push({ type: "bin", id: loc.id, label: loc.id, sub: loc.customName || "Aisle bin", idx: i, qty: c.qty, bb: c.bestBefore || "", description: c.description });
      });
    });
    Object.entries(floorStock || {}).forEach(([wh, items]) => {
      (items || []).forEach((it, i) => {
        if (String(it.productCode || "").toUpperCase() === code && it.qty > 0)
          out.push({ type: "floor", id: wh, label: WH_LABEL(wh).toUpperCase(), sub: "Floor stock", idx: i, qty: it.qty, bb: it.bestBefore || "", description: it.description });
      });
    });
    out.sort((a, b) => {
      if (!a.bb && !b.bb) return 0;
      if (!a.bb) return 1;                 // no date = pick last
      if (!b.bb) return -1;
      return a.bb.localeCompare(b.bb);     // oldest first
    });
    return out;
  }, [activeLine, locations, floorStock]);

  const totalAvail = sources.reduce((s, x) => s + x.qty, 0);
  const remaining  = activeLine ? Math.max(0, activeLine.reqQty - activeLine.pickedQty) : 0;

  /* ── Load the order and claim it ── */
  const openOrder = async () => {
    const inv = String(invoiceIn).replace(/[\r\n\t\s]/g, "").trim();
    if (!inv) return;
    if (!GS.configured()) { setError("Google Sheets isn't connected on this device. Open /setup.html."); return; }
    setBusy(true); setError("");
    try {
      const r = await GS.getOrder(inv);
      if (!r || !r.ok) { setError(r?.error || `Order ${inv} not found.`); setInvoiceIn(""); return; }
      if (r.lockedBy && r.lockedBy !== session.username) {
        setError(`Order ${inv} is in use by ${r.lockedBy}.`); setInvoiceIn(""); return;
      }
      const claim = await GS.claimOrder(inv, session.username);
      if (!claim || !claim.ok) {
        setError(claim?.lockedBy ? `Order ${inv} is in use by ${claim.lockedBy}.` : "Couldn't claim this order.");
        setInvoiceIn(""); return;
      }
      setOrder({ invoiceNo: r.invoiceNo, customer: r.customer, dueDate: normDate(r.dueDate), customerPO: r.customerPO, lines: r.lines || [] });
      addLog("ORDER_OPEN", `${inv} claimed`, session.username);
      setStep("lines");
      setInvoiceIn("");
    } catch (e) {
      console.error(e); setError("Couldn't reach the order list: " + e.message);
    } finally { setBusy(false); }
  };

  const chooseLine = (line) => {
    setActiveKey(line.lineKey); setSrcIdx(0); setQty(""); setError(""); setBlocking(false); setBlockReason("");
    setReversing(false); setRevIdx(0); setRevQty("");
    setStep("pick");
  };

  /* Scan a carton on the order screen: matches it against this order's SKUs
     and jumps straight to that line. A product not on the order is refused —
     that's the point: wrong-product picks get caught at the scan. */
  const [scanIn, setScanIn] = useState("");
  const scanToLine = () => {
    const raw = String(scanIn).replace(/[\r\n\t]/g, "").trim();
    setScanIn("");
    if (!raw) return;
    const prod = findProduct(products, raw);
    const code = (prod ? prod.code : raw).toUpperCase();
    const line = order.lines.find(l => l.partNo === code && !l.blocked && l.pickedQty < l.reqQty)
              || order.lines.find(l => l.partNo === code);
    if (!line) { showToast(`⚠ ${code} is not on this order`, "err"); return; }
    if (line.blocked) { showToast("⚠ That line is on hold", "err"); return; }
    if (line.pickedQty >= line.reqQty) { showToast("✓ That line is already fully picked", "err"); return; }
    chooseLine(line);
  };

  /* Pickers can release picker holds. Admin holds need the admin screen. */
  const canRelease = (line) => session.role === "admin" || line.blockedByRole !== "admin";

  /* ── Reverse a pick: stock goes back to the exact spot it came from ── */
  const [reversing, setReversing]   = useState(false);
  const [revIdx, setRevIdx]         = useState(0);
  const [revQty, setRevQty]         = useState("");

  const confirmReverse = async () => {
    const g = (activeLine.picks || [])[revIdx];
    if (!g) { setError("Choose where it goes back to."); return; }
    const n = parseFloat(revQty);
    if (!n || n <= 0)  { setError("Enter a quantity."); return; }
    if (n > g.qty)     { setError(`Only ${fmtQty(g.qty)} was picked from ${g.source}.`); return; }
    setBusy(true); setError("");
    try {
      const r = await GS.unpickLine({
        invoiceNo: order.invoiceNo, lineKey: activeLine.lineKey,
        partNo: activeLine.partNo, description: activeLine.description,
        source: g.source, bb: g.bb, qty: n, user: session.username,
      });
      if (!r || !r.ok) throw new Error(r?.error || "Couldn't reverse");
      if (skipNextSync) skipNextSync();
      // Put the stock back locally so the screen matches the sheet
      if (g.source.indexOf("FLOOR:") === 0) {
        const wh = g.source.substring(6);
        setFloorStock(prev => {
          const items = [...(prev[wh] || [])];
          const i = items.findIndex(it => String(it.productCode).toUpperCase() === activeLine.partNo && (it.bestBefore || "") === g.bb);
          if (i >= 0) items[i] = { ...items[i], qty: items[i].qty + n };
          else items.push({ productCode: activeLine.partNo, description: activeLine.description, qty: n, bestBefore: g.bb, storedAt: new Date().toISOString() });
          return { ...prev, [wh]: items };
        });
      } else {
        setLocations(prev => {
          const loc = prev[g.source]; if (!loc) return prev;
          const contents = [...loc.contents];
          const i = contents.findIndex(c => String(c.productCode).toUpperCase() === activeLine.partNo && (c.bestBefore || "") === g.bb);
          if (i >= 0) contents[i] = { ...contents[i], qty: contents[i].qty + n };
          else contents.push({ productCode: activeLine.partNo, description: activeLine.description, qty: n, bestBefore: g.bb, storedAt: new Date().toISOString() });
          return { ...prev, [g.source]: { ...loc, contents } };
        });
      }
      const newPicked = r.pickedQty !== undefined ? r.pickedQty : activeLine.pickedQty - n;
      setOrder(o => ({ ...o, lines: o.lines.map(l => l.lineKey === activeLine.lineKey
        ? { ...l, pickedQty: newPicked,
            picks: (l.picks || []).map((p, i) => i === revIdx ? { ...p, qty: p.qty - n } : p).filter(p => p.qty > 0.0001) }
        : l) }));
      addLog("ORDER_UNPICK", `${order.invoiceNo} | ${activeLine.partNo} | ${fmtQty(n)} back to ${g.source} | BB:${g.bb || "—"}`, session.username);
      showToast(`✓ ${fmtQty(n)} back to ${g.source.replace("FLOOR:", "")} `);
      setReversing(false); setRevQty("");
      setStep("lines");
    } catch (e) { setError(e.message); }
    finally { setBusy(false); }
  };

  const confirmRelease = async () => {
    setBusy(true); setError("");
    try {
      const r = await GS.setBlock({ invoiceNo: order.invoiceNo, lineKey: activeLine.lineKey, blocked: false, reason: "", user: session.username, role: session.role });
      if (!r || !r.ok) throw new Error(r?.error || "Couldn't release");
      setOrder(o => ({ ...o, lines: o.lines.map(l => l.lineKey === activeLine.lineKey ? { ...l, blocked: false, blockReason: "", blockedByRole: "", blockedByUser: "" } : l) }));
      addLog("ORDER_RELEASE", `${order.invoiceNo} | ${activeLine.partNo} released`, session.username);
      showToast("✓ Hold released — line is pickable again");
      setStep("lines");
    } catch (e) { setError(e.message); }
    finally { setBusy(false); }
  };

  /* ── Deduct stock, record the pick ── */
  const confirmPick = async () => {
    const src = sources[srcIdx];
    if (!src) { setError("Choose where you're picking from."); return; }
    const n = parseFloat(qty);
    if (!n || n <= 0)      { setError("Enter a quantity."); return; }
    if (n > src.qty)       { setError(`Only ${fmtQty(src.qty)} in ${src.label}.`); return; }
    if (n > remaining)     { setError(`This line only needs ${fmtQty(remaining)} more.`); return; }

    setBusy(true); setError("");
    try {
      const r = await GS.pickLine({
        invoiceNo: order.invoiceNo,
        lineKey:   activeLine.lineKey,
        partNo:    activeLine.partNo,
        description: activeLine.description,
        qty: n,
        source: src.type === "bin" ? src.id : `FLOOR:${src.id}`,
        bb: src.bb,
        user: session.username,
      });
      if (!r || !r.ok) throw new Error(r?.error || "Couldn't save the pick");

      // Sheets has already deducted the stock server-side. Mirror it locally
      // for the display, but suppress the snapshot save that would follow.
      if (skipNextSync) skipNextSync();
      if (src.type === "bin") {
        setLocations(prev => {
          const loc = prev[src.id]; if (!loc) return prev;
          const left = (loc.contents[src.idx]?.qty || 0) - n;
          const contents = left <= 0
            ? loc.contents.filter((_, i) => i !== src.idx)
            : loc.contents.map((c, i) => i === src.idx ? { ...c, qty: left } : c);
          return { ...prev, [src.id]: { ...loc, contents } };
        });
      } else {
        setFloorStock(prev => {
          const items = prev[src.id] || [];
          const left = (items[src.idx]?.qty || 0) - n;
          const next = left <= 0
            ? items.filter((_, i) => i !== src.idx)
            : items.map((it, i) => i === src.idx ? { ...it, qty: left } : it);
          return { ...prev, [src.id]: next };
        });
      }

      const newPicked = r.pickedQty !== undefined ? r.pickedQty : activeLine.pickedQty + n;
      setOrder(o => ({ ...o, lines: o.lines.map(l => l.lineKey === activeLine.lineKey ? { ...l, pickedQty: newPicked } : l) }));
      addLog("ORDER_PICK", `${order.invoiceNo} | ${activeLine.partNo} | ${fmtQty(n)} from ${src.type === "bin" ? src.id : "FLOOR " + src.id} | BB:${src.bb || "—"}`, session.username);
      showToast(`✓ Picked ${fmtQty(n)} from ${src.label}`);
      setStep("lines");
    } catch (e) {
      console.error(e);
      setError("Nothing was deducted — " + e.message);
    } finally { setBusy(false); }
  };

  /* ── Put a line on hold ── */
  const confirmBlock = async () => {
    if (!blockReason.trim()) { setError("Give a reason so admin knows why."); return; }
    setBusy(true); setError("");
    try {
      const r = await GS.setBlock({ invoiceNo: order.invoiceNo, lineKey: activeLine.lineKey, blocked: true, reason: blockReason.trim(), user: session.username, role: session.role });
      if (!r || !r.ok) throw new Error(r?.error || "Couldn't save");
      setOrder(o => ({ ...o, lines: o.lines.map(l => l.lineKey === activeLine.lineKey ? { ...l, blocked: true, blockReason: blockReason.trim(), blockedByRole: session.role, blockedByUser: session.username } : l) }));
      addLog("ORDER_HOLD", `${order.invoiceNo} | ${activeLine.partNo} | ${blockReason.trim()}`, session.username);
      showToast("✓ Line on hold — admin will release it");
      setStep("lines");
    } catch (e) { setError(e.message); }
    finally { setBusy(false); }
  };

  const saveExit = async () => {
    setBusy(true);
    try { await GS.releaseOrder(order.invoiceNo, session.username); } catch (e) { console.error(e); }
    const done = order.lines.filter(l => l.blocked || l.pickedQty >= l.reqQty).length;
    addLog("ORDER_SAVE", `${order.invoiceNo} | ${done}/${order.lines.length} lines done`, session.username);
    setOrder(null); orderRef.current = null;
    showToast(`✓ ${order.invoiceNo} saved — ${done} of ${order.lines.length} lines done`);
    setBusy(false);
    onDone();
  };

  const linesDone  = order ? order.lines.filter(l => l.blocked || l.pickedQty >= l.reqQty).length : 0;
  const allDone    = order && order.lines.length > 0 && linesDone === order.lines.length;

  /* ═══ RENDER ═══ */
  return (
    <div>
      <StepBar steps={["ENTER ORDER", "PICK LINES", "SAVE"]}
        current={{ enter: 0, lines: 1, pick: 1, done: 2 }[step] ?? 0} color={G.amber} />

      {/* ── 1. Enter invoice no ── */}
      {step === "enter" && (
        <div style={{ animation: "fadeUp .2s ease" }}>
          <SectionTitle icon="📋" color={G.amber} title="Enter Order" sub="Type the invoice number, e.g. 215436" />
          <input ref={invRef} className="inp-dark" inputMode="numeric"
            style={{ fontWeight: 800, fontSize: 28, letterSpacing: 4, textAlign: "center" }}
            placeholder="000000" value={invoiceIn}
            onChange={e => { setInvoiceIn(e.target.value); setError(""); }}
            onKeyDown={e => e.key === "Enter" && openOrder()} />
          {error && <ErrBox msg={error} />}
          <button className="btn-amber-xl" style={{ width: "100%", marginTop: 16 }} onClick={openOrder} disabled={busy}>
            {busy ? "LOADING…" : "OPEN ORDER"}
          </button>
        </div>
      )}

      {/* ── 2. Line list ── */}
      {step === "lines" && order && (
        <div style={{ animation: "fadeUp .2s ease" }}>
          <div style={{ background: "#1e1e1e", border: `2px solid ${allDone ? G.green : G.amber}`, borderRadius: 10, padding: "14px 16px", marginBottom: 18 }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 12 }}>
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{ fontFamily: "monospace", fontWeight: 800, fontSize: 24, color: "#fff" }}>{order.invoiceNo}</div>
                <div style={{ color: "#bbb", fontSize: 14, marginTop: 2 }}>{order.customer}</div>
                {order.customerPO && <div style={{ color: "#666", fontSize: 12, marginTop: 2 }}>PO {order.customerPO}</div>}
              </div>
              <div style={{ textAlign: "right", flexShrink: 0 }}>
                <div style={{ fontSize: 11, color: "#666", letterSpacing: 1 }}>DUE</div>
                <div style={{ color: G.amber, fontWeight: 700, fontSize: 15 }}>{order.dueDate || "—"}</div>
              </div>
            </div>
            <div style={{ marginTop: 12, height: 6, background: "#2a2a2a", borderRadius: 3, overflow: "hidden" }}>
              <div style={{ height: "100%", width: `${order.lines.length ? (linesDone / order.lines.length) * 100 : 0}%`, background: allDone ? G.green : G.amber, transition: "width .3s" }} />
            </div>
            <div style={{ color: allDone ? G.green : "#888", fontSize: 13, marginTop: 6, fontWeight: 700 }}>
              {linesDone} of {order.lines.length} lines done{allDone && " — order complete"}
            </div>
          </div>

          <input className="inp-dark" autoFocus
            style={{ marginBottom: 14, fontSize: 18 }}
            placeholder="🔍 Scan carton to jump to its line"
            value={scanIn}
            onChange={e => setScanIn(e.target.value)}
            onKeyDown={e => e.key === "Enter" && scanToLine()} />

          <div style={{ display: "grid", gap: 10 }}>
            {order.lines.map(l => {
              const short = l.pickedQty > 0 && l.pickedQty < l.reqQty;
              const full  = l.pickedQty >= l.reqQty;
              const col   = l.blocked ? "#7a5cff" : full ? G.green : short ? G.yellow : "#333";
              return (
                <button key={l.lineKey} onClick={() => chooseLine(l)}
                  style={{ width: "100%", background: "#1e1e1e", border: `2px solid ${col}`, borderRadius: 10, padding: "14px 16px", cursor: "pointer", textAlign: "left", display: "flex", gap: 12, alignItems: "center" }}>
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div style={{ fontFamily: "monospace", color: G.amber, fontSize: 13, fontWeight: 700 }}>{l.partNo}</div>
                    <div style={{ color: "#fff", fontWeight: 700, fontSize: 15, marginTop: 2 }}>{l.description}</div>
                    {l.blocked && <div style={{ color: "#9b85ff", fontSize: 12, marginTop: 4, fontWeight: 700 }}>⏸ {l.blockedByRole === "admin" ? "ADMIN HOLD" : "ON HOLD"} — {l.blockReason}</div>}
                  </div>
                  <div style={{ textAlign: "right", flexShrink: 0 }}>
                    <div style={{ fontWeight: 800, fontSize: 22, color: full ? G.green : "#fff", lineHeight: 1 }}>
                      {fmtQty(l.pickedQty)}<span style={{ color: "#666", fontSize: 15 }}>/{fmtQty(l.reqQty)}</span>
                    </div>
                    <div style={{ fontSize: 11, color: full ? G.green : short ? G.yellow : "#666", fontWeight: 700, marginTop: 3 }}>
                      {l.blocked ? "HOLD" : full ? "✓ DONE" : short ? "PART" : "TO PICK"}
                    </div>
                  </div>
                </button>
              );
            })}
          </div>

          <button className={allDone ? "btn-green-xl" : "btn-amber-xl"} style={{ width: "100%", marginTop: 20 }} onClick={saveExit} disabled={busy}>
            {busy ? "SAVING…" : allDone ? "COMPLETE ORDER" : "SAVE & EXIT"}
          </button>
          <div style={{ color: "#555", fontSize: 12, textAlign: "center", marginTop: 8 }}>
            Part-picked orders can be finished later by anyone.
          </div>
        </div>
      )}

      {/* ── 3. Pick a line ── */}
      {step === "pick" && activeLine && (
        <div style={{ animation: "fadeUp .2s ease" }}>
          <button onClick={() => setStep("lines")} style={{ background: "none", border: "none", color: G.amber, fontSize: 14, fontWeight: 700, cursor: "pointer", padding: "0 0 12px" }}>‹ BACK TO LINES</button>

          <div style={{ background: "#1e1e1e", border: "1px solid #2a2a2a", borderRadius: 8, padding: "14px 16px", marginBottom: 18 }}>
            <div style={{ fontFamily: "monospace", color: G.amber, fontSize: 13, fontWeight: 700 }}>{activeLine.partNo}</div>
            <div style={{ color: "#fff", fontWeight: 800, fontSize: 18, marginTop: 2 }}>{activeLine.description}</div>
            <div style={{ display: "flex", gap: 20, marginTop: 10 }}>
              <div><div style={{ fontSize: 11, color: "#666", letterSpacing: 1 }}>REQUIRED</div><div style={{ color: "#fff", fontWeight: 800, fontSize: 20 }}>{fmtQty(activeLine.reqQty)}</div></div>
              <div><div style={{ fontSize: 11, color: "#666", letterSpacing: 1 }}>PICKED</div><div style={{ color: G.green, fontWeight: 800, fontSize: 20 }}>{fmtQty(activeLine.pickedQty)}</div></div>
              <div><div style={{ fontSize: 11, color: "#666", letterSpacing: 1 }}>STILL NEEDED</div><div style={{ color: G.amber, fontWeight: 800, fontSize: 20 }}>{fmtQty(remaining)}</div></div>
            </div>
          </div>

          {activeLine.blocked && (
            <div style={{ background: "#1a1428", border: "2px solid #7a5cff", borderRadius: 10, padding: 18, animation: "fadeUp .15s ease" }}>
              <div style={{ color: "#b8a5ff", fontWeight: 800, fontSize: 18 }}>
                ⏸ {activeLine.blockedByRole === "admin" ? "Held by admin" : `On hold by ${activeLine.blockedByUser || "a picker"}`}
              </div>
              <div style={{ color: "#8a7ab8", fontSize: 14, marginTop: 6 }}>{activeLine.blockReason}</div>
              {error && <ErrBox msg={error} />}
              {canRelease(activeLine) ? (
                <button className="btn-amber-xl" style={{ width: "100%", marginTop: 16 }} onClick={confirmRelease} disabled={busy}>
                  {busy ? "RELEASING…" : "RELEASE HOLD"}
                </button>
              ) : (
                <div style={{ color: "#8a7ab8", fontSize: 13, marginTop: 14, fontWeight: 700 }}>
                  Only admin can release this hold.
                </div>
              )}
            </div>
          )}

          {!activeLine.blocked && !blocking && !reversing && (
            <>
              {sources.length === 0 ? (
                <div style={{ background: "#2a1010", border: `2px solid ${G.red}`, borderRadius: 10, padding: 18, textAlign: "center" }}>
                  <div style={{ color: G.red, fontWeight: 800, fontSize: 18 }}>No stock found</div>
                  <div style={{ color: "#c47070", fontSize: 14, marginTop: 6 }}>
                    Nothing in any bin or on the floor for {activeLine.partNo}. Put the line on hold so admin can look at it.
                  </div>
                </div>
              ) : (
                <>
                  <div style={{ fontSize: 11, color: "#666", letterSpacing: 1, fontWeight: 700, marginBottom: 10 }}>
                    PICK FROM — OLDEST BEST-BEFORE FIRST · {fmtQty(totalAvail)} AVAILABLE
                  </div>
                  <div style={{ display: "grid", gap: 8, marginBottom: 18 }}>
                    {sources.map((s, i) => {
                      const sel = i === srcIdx;
                      return (
                        <button key={`${s.type}-${s.id}-${s.idx}`} onClick={() => { setSrcIdx(i); setError(""); }}
                          style={{ width: "100%", background: sel ? "#2a2200" : "#1a1a1a", border: `2px solid ${sel ? G.amber : "#2a2a2a"}`, borderRadius: 10, padding: "13px 15px", cursor: "pointer", textAlign: "left", display: "flex", alignItems: "center", gap: 12 }}>
                          <div style={{ flex: 1, minWidth: 0 }}>
                            <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                              <span style={{ color: "#fff", fontWeight: 800, fontSize: 17 }}>{s.type === "floor" ? WH_LABEL(s.id).toUpperCase() : s.label}</span>
                              {i === 0 && <span style={{ background: G.amber, color: "#1a1a1a", borderRadius: 3, padding: "1px 6px", fontSize: 10, fontWeight: 800, letterSpacing: .5 }}>OLDEST</span>}
                            </div>
                            <div style={{ color: "#777", fontSize: 12, marginTop: 1 }}>{s.sub}</div>
                            <div style={{ marginTop: 5 }}><span style={{ color: "#8a7a4a", fontSize: 11, fontWeight: 700, letterSpacing: 1 }}>BB </span><span style={{ color: G.amber, fontSize: 22, fontWeight: 800, letterSpacing: .5 }}>{s.bb || "—"}</span></div>
                          </div>
                          <div style={{ textAlign: "right", flexShrink: 0 }}>
                            <div style={{ color: "#fff", fontWeight: 800, fontSize: 22, lineHeight: 1 }}>{fmtQty(s.qty)}</div>
                            <div style={{ fontSize: 11, color: "#666" }}>avail</div>
                          </div>
                        </button>
                      );
                    })}
                  </div>

                  <label className="lbl-dark">QUANTITY PICKED</label>
                  <input className="inp-dark" inputMode="decimal"
                    style={{ fontWeight: 800, fontSize: 26, textAlign: "center" }}
                    placeholder="0" value={qty}
                    onChange={e => { setQty(e.target.value); setError(""); }}
                    onKeyDown={e => e.key === "Enter" && confirmPick()} />
                  <div style={{ display: "flex", gap: 8, marginTop: 10, flexWrap: "wrap" }}>
                    <button className="btn-ghost-sm" onClick={() => setQty(String(Math.min(remaining, sources[srcIdx]?.qty || 0)))}>
                      FILL — {fmtQty(Math.min(remaining, sources[srcIdx]?.qty || 0))}
                    </button>
                    <button className="btn-ghost-sm" onClick={() => setQty(fmtQty(sources[srcIdx]?.qty || 0))}>
                      ALL IN {sources[srcIdx]?.label}
                    </button>
                  </div>

                  {error && <ErrBox msg={error} />}

                  <button className="btn-green-xl" style={{ width: "100%", marginTop: 16 }} onClick={confirmPick} disabled={busy}>
                    {busy ? "SAVING…" : "CONFIRM PICK"}
                  </button>
                  <div style={{ color: "#555", fontSize: 12, textAlign: "center", marginTop: 8 }}>
                    Short of the full quantity? Record what you found — the line stays open.
                  </div>
                </>
              )}

              <button className="btn-outline-xl" style={{ width: "100%", marginTop: 12 }} onClick={() => { setBlocking(true); setError(""); }}>
                ⏸ PUT LINE ON HOLD
              </button>
              {activeLine.pickedQty > 0 && (activeLine.picks || []).length > 0 && (
                <button className="btn-outline-xl" style={{ width: "100%", marginTop: 12, borderColor: "#4a6adf", color: "#7a9aee" }}
                  onClick={() => { setReversing(true); setRevIdx(0); setRevQty(""); setError(""); }}>
                  ↩ REVERSE A PICK
                </button>
              )}
            </>
          )}

          {/* ── Reverse pick panel ── */}
          {!activeLine.blocked && reversing && (
            <div style={{ background: "#0a0d22", border: "2px solid #4a6adf", borderRadius: 10, padding: 18, animation: "fadeUp .15s ease" }}>
              <div style={{ color: "#7a9aee", fontWeight: 800, fontSize: 18, marginBottom: 4 }}>Reverse a pick</div>
              <div style={{ color: "#5a6a9e", fontSize: 13, marginBottom: 14 }}>
                The cartons go back to the spot they were picked from — put them back in that location.
              </div>
              <div style={{ fontSize: 11, color: "#5a6a9e", letterSpacing: 1, fontWeight: 700, marginBottom: 8 }}>PICKED FROM:</div>
              <div style={{ display: "grid", gap: 8, marginBottom: 14 }}>
                {(activeLine.picks || []).map((g, i) => {
                  const sel = i === revIdx;
                  return (
                    <button key={g.source + g.bb} onClick={() => { setRevIdx(i); setError(""); }}
                      style={{ width: "100%", background: sel ? "#101838" : "#0d1020", border: `2px solid ${sel ? "#4a6adf" : "#1a2040"}`, borderRadius: 10, padding: "12px 15px", cursor: "pointer", textAlign: "left", display: "flex", alignItems: "center", gap: 12 }}>
                      <div style={{ flex: 1, minWidth: 0 }}>
                        <div style={{ color: "#fff", fontWeight: 800, fontSize: 17 }}>{g.source.replace("FLOOR:", "") }{g.source.indexOf("FLOOR:") === 0 && <span style={{ color: "#5a6a9e", fontSize: 12, fontWeight: 700 }}> · FLOOR</span>}</div>
                        <div style={{ marginTop: 3 }}><span style={{ fontSize: 11, color: "#5a6a9e", fontWeight: 700, letterSpacing: 1 }}>BB </span><span style={{ color: "#7a9aee", fontSize: 18, fontWeight: 800 }}>{g.bb || "—"}</span></div>
                      </div>
                      <div style={{ textAlign: "right", flexShrink: 0 }}>
                        <div style={{ color: "#fff", fontWeight: 800, fontSize: 22, lineHeight: 1 }}>{fmtQty(g.qty)}</div>
                        <div style={{ fontSize: 11, color: "#5a6a9e" }}>reversible</div>
                      </div>
                    </button>
                  );
                })}
              </div>
              <label className="lbl-dark">QUANTITY TO REVERSE</label>
              <input className="inp-dark" inputMode="decimal"
                style={{ fontWeight: 800, fontSize: 26, textAlign: "center" }}
                placeholder="0" value={revQty}
                onChange={e => { setRevQty(e.target.value); setError(""); }}
                onKeyDown={e => e.key === "Enter" && confirmReverse()} />
              <div style={{ display: "flex", gap: 8, marginTop: 10 }}>
                <button className="btn-ghost-sm" onClick={() => setRevQty(fmtQty((activeLine.picks || [])[revIdx]?.qty || 0))}>
                  ALL — {fmtQty((activeLine.picks || [])[revIdx]?.qty || 0)}
                </button>
              </div>
              {error && <ErrBox msg={error} />}
              <div style={{ display: "flex", gap: 10, marginTop: 14 }}>
                <button className="btn-xl-blue" style={{ flex: 1 }} onClick={confirmReverse} disabled={busy}>{busy ? "REVERSING…" : "REVERSE"}</button>
                <button className="btn-outline-xl" style={{ flex: 1 }} onClick={() => { setReversing(false); setError(""); }}>CANCEL</button>
              </div>
            </div>
          )}

          {!activeLine.blocked && blocking && !reversing && (
            <div style={{ background: "#1a1428", border: "2px solid #7a5cff", borderRadius: 10, padding: 18, animation: "fadeUp .15s ease" }}>
              <div style={{ color: "#b8a5ff", fontWeight: 800, fontSize: 18, marginBottom: 4 }}>Put this line on hold</div>
              <div style={{ color: "#8a7ab8", fontSize: 13, marginBottom: 14 }}>
                The line stops being pickable and stays on the order. Admin releases it when it's ready to go.
              </div>
              <label className="lbl-dark">REASON</label>
              <input className="inp-dark" value={blockReason} autoFocus
                placeholder="e.g. damaged, quarantine, not shipping today"
                onChange={e => { setBlockReason(e.target.value); setError(""); }}
                onKeyDown={e => e.key === "Enter" && confirmBlock()} />
              {error && <ErrBox msg={error} />}
              <div style={{ display: "flex", gap: 10, marginTop: 14 }}>
                <button className="btn-amber-xl" style={{ flex: 1 }} onClick={confirmBlock} disabled={busy}>{busy ? "SAVING…" : "PUT ON HOLD"}</button>
                <button className="btn-outline-xl" style={{ flex: 1 }} onClick={() => { setBlocking(false); setError(""); }}>CANCEL</button>
              </div>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════════════════════
   REMOVE STOCK — area → scan product → batch (oldest first) → qty
══════════════════════════════════════════════════════════════════════════ */
function RemoveStockFlow({ session, products, locations, setLocations, floorStock, setFloorStock, addLog, showToast, onDone, skipNextSync }) {
  const [step, setStep]   = useState("area");   // area | product | batch | qty
  const [area, setArea]   = useState(null);     // internal key: Dandenong / Unit 2 / Unit 6
  const [input, setInput] = useState("");
  const [prod, setProd]   = useState(null);
  const [sel, setSel]     = useState(null);     // chosen batch
  const [qty, setQty]     = useState("");
  const [error, setError] = useState("");
  const [busy, setBusy]   = useState(false);
  const inRef = useRef(null);
  useEffect(() => { if (step === "product") setTimeout(() => inRef.current?.focus(), 80); }, [step]);

  /* Everything this product sits in, inside the chosen area, oldest batch first */
  const batches = React.useMemo(() => {
    if (!prod || !area) return [];
    const code = prod.code.toUpperCase();
    const out = [];
    Object.values(locations || {}).forEach(loc => {
      if (binArea(loc.id) !== area) return;
      (loc.contents || []).forEach((c, i) => {
        if (String(c.productCode).toUpperCase() === code && c.qty > 0)
          out.push({ type: "bin", id: loc.id, label: loc.id, sub: loc.customName || "Bin", idx: i, qty: c.qty, bb: c.bestBefore || "" });
      });
    });
    (floorStock[area] || []).forEach((it, i) => {
      if (String(it.productCode).toUpperCase() === code && it.qty > 0)
        out.push({ type: "floor", id: area, label: WH_LABEL(area).toUpperCase(), sub: "Floor stock", idx: i, qty: it.qty, bb: it.bestBefore || "" });
    });
    out.sort((a, b) => { if (!a.bb && !b.bb) return 0; if (!a.bb) return 1; if (!b.bb) return -1; return a.bb.localeCompare(b.bb); });
    return out;
  }, [prod, area, locations, floorStock]);

  const findIt = () => {
    const raw = String(input).replace(/[\r\n\t]/g, "").trim();
    if (!raw) return;
    const p = findProduct(products, raw);
    if (!p) { setError(`No product matches "${raw}".`); setInput(""); return; }
    setProd(p); setError(""); setInput(""); setStep("batch");
  };

  const doRemove = async (all) => {
    const n = all ? sel.qty : parseFloat(qty);
    if (!n || n <= 0 || n > sel.qty) { setError(`Enter 1–${fmtQty(sel.qty)}.`); return; }
    setBusy(true); setError("");
    const src = sel.type === "bin" ? sel.id : "FLOOR:" + sel.id;
    const r = await stockCall(GS.stockRemove, { source: src, partNo: prod.code, bb: sel.bb, qty: n });
    if (!r.ok) { setError("Not saved — " + r.error); setBusy(false); return; }
    if (skipNextSync) skipNextSync();
    if (sel.type === "bin") {
      setLocations(prev => {
        const loc = prev[sel.id]; if (!loc) return prev;
        const left = (loc.contents[sel.idx]?.qty || 0) - n;
        const contents = left <= 0 ? loc.contents.filter((_,i)=>i!==sel.idx) : loc.contents.map((c,i)=>i===sel.idx?{...c,qty:left}:c);
        return { ...prev, [sel.id]: { ...loc, contents } };
      });
    } else {
      setFloorStock(prev => {
        const items = prev[sel.id] || [];
        const left = (items[sel.idx]?.qty || 0) - n;
        const next = left <= 0 ? items.filter((_,i)=>i!==sel.idx) : items.map((it,i)=>i===sel.idx?{...it,qty:left}:it);
        return { ...prev, [sel.id]: next };
      });
    }
    addLog("REMOVE", `${prod.description} ← ${sel.type==="bin"?sel.id:"FLOOR "+WH_LABEL(sel.id)} | Removed:${fmtQty(n)} | BB:${sel.bb||"—"}`, session.username);
    showToast(`✓ Removed ${fmtQty(n)} from ${sel.label}`);
    setBusy(false);
    onDone();
  };

  const Back = ({ to }) => (
    <button onClick={() => { setError(""); setStep(to); }} style={{ background: "none", border: "none", color: G.amber, fontSize: 14, fontWeight: 700, cursor: "pointer", padding: "0 0 12px" }}>‹ BACK</button>
  );

  return (
    <div>
      <StepBar steps={["AREA","PRODUCT","BATCH","REMOVE"]} current={{area:0,product:1,batch:2,qty:3}[step]} color={G.red} />

      {step === "area" && (
        <div style={{ animation: "fadeUp .2s ease" }}>
          <SectionTitle icon="📍" color={G.red} title="Where is the stock?" sub="Pick the area" />
          <div style={{ display: "grid", gap: 10 }}>
            {["Dandenong","Unit 2","Unit 6"].map(a => (
              <button key={a} onClick={() => { setArea(a); setStep("product"); }}
                style={{ padding: "20px 18px", background: "#1e1e1e", border: "2px solid #333", borderRadius: 12, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "space-between" }}>
                <span style={{ color: "#fff", fontWeight: 800, fontSize: 20, letterSpacing: .5 }}>{WH_LABEL(a).toUpperCase()}</span>
                <span style={{ color: G.red, fontSize: 22 }}>›</span>
              </button>
            ))}
          </div>
        </div>
      )}

      {step === "product" && (
        <div style={{ animation: "fadeUp .2s ease" }}>
          <Back to="area" />
          <SectionTitle icon="🔍" color={G.red} title={WH_LABEL(area)} sub="Scan barcode or type the product code" />
          <input ref={inRef} className="inp-dark" placeholder="Scan or type product code"
            value={input} onChange={e => { setInput(e.target.value); setError(""); }}
            onKeyDown={e => e.key === "Enter" && findIt()} />
          {error && <ErrBox msg={error} />}
          <button className="btn-red-xl" style={{ width: "100%", marginTop: 14 }} onClick={findIt}>SEARCH</button>
        </div>
      )}

      {step === "batch" && prod && (
        <div style={{ animation: "fadeUp .2s ease" }}>
          <Back to="product" />
          <div style={{ background: "#1e1e1e", border: "1px solid #2a2a2a", borderRadius: 8, padding: "12px 14px", marginBottom: 16 }}>
            <div style={{ fontFamily: "monospace", color: G.amber, fontSize: 13, fontWeight: 700 }}>{prod.code}</div>
            <div style={{ color: "#fff", fontWeight: 800, fontSize: 17 }}>{prod.description}</div>
          </div>
          {batches.length === 0 ? (
            <div style={{ background: "#2a1010", border: `2px solid ${G.red}`, borderRadius: 10, padding: 18, textAlign: "center" }}>
              <div style={{ color: G.red, fontWeight: 800, fontSize: 18 }}>Nothing in {WH_LABEL(area)}</div>
              <div style={{ color: "#c47070", fontSize: 14, marginTop: 6 }}>No bins or floor stock hold {prod.code} here.</div>
            </div>
          ) : (
            <>
              <div style={{ fontSize: 11, color: "#666", letterSpacing: 1, fontWeight: 700, marginBottom: 10 }}>PICK A BATCH — OLDEST FIRST</div>
              <div style={{ display: "grid", gap: 8 }}>
                {batches.map((b, i) => (
                  <button key={b.type + b.id + b.idx} onClick={() => { setSel(b); setQty(""); setError(""); setStep("qty"); }}
                    style={{ width: "100%", background: "#1a1a1a", border: "2px solid #2a2a2a", borderRadius: 10, padding: "13px 15px", cursor: "pointer", textAlign: "left", display: "flex", alignItems: "center", gap: 12 }}>
                    <div style={{ flex: 1, minWidth: 0 }}>
                      <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                        <span style={{ color: "#fff", fontWeight: 800, fontSize: 17 }}>{b.label}</span>
                        {i === 0 && <span style={{ background: G.amber, color: "#1a1a1a", borderRadius: 3, padding: "1px 6px", fontSize: 10, fontWeight: 800 }}>OLDEST</span>}
                      </div>
                      <div style={{ color: "#777", fontSize: 12, marginTop: 1 }}>{b.sub}</div>
                      <div style={{ marginTop: 4 }}><span style={{ fontSize: 11, color: "#8a7a4a", fontWeight: 700, letterSpacing: 1 }}>BATCH </span><span style={{ color: G.amber, fontSize: 20, fontWeight: 800 }}>{b.bb || "—"}</span></div>
                    </div>
                    <div style={{ textAlign: "right", flexShrink: 0 }}>
                      <div style={{ color: "#fff", fontWeight: 800, fontSize: 22, lineHeight: 1 }}>{fmtQty(b.qty)}</div>
                      <div style={{ fontSize: 11, color: "#666" }}>ctns</div>
                    </div>
                  </button>
                ))}
              </div>
            </>
          )}
        </div>
      )}

      {step === "qty" && sel && (
        <div style={{ animation: "fadeUp .2s ease" }}>
          <Back to="batch" />
          <div style={{ background: "#1e1e1e", border: "1px solid #2a2a2a", borderRadius: 8, padding: "12px 14px", marginBottom: 16 }}>
            <div style={{ color: "#fff", fontWeight: 800, fontSize: 17 }}>{prod.description}</div>
            <div style={{ color: "#aaa", fontSize: 14, marginTop: 4 }}>{sel.label} · <span style={{ color: G.amber, fontWeight: 800, fontSize: 17 }}>{sel.bb || "—"}</span> · {fmtQty(sel.qty)} ctns</div>
          </div>
          <label className="lbl-dark">QUANTITY TO REMOVE</label>
          <input className="inp-dark" inputMode="decimal" autoFocus
            style={{ fontWeight: 800, fontSize: 26, textAlign: "center" }}
            placeholder="0" value={qty}
            onChange={e => { setQty(e.target.value); setError(""); }}
            onKeyDown={e => e.key === "Enter" && doRemove(false)} />
          {error && <ErrBox msg={error} />}
          <button className="btn-red-xl" style={{ width: "100%", marginTop: 14 }} onClick={() => doRemove(false)} disabled={busy}>{busy ? "SAVING…" : "REMOVE"}</button>
          <button className="btn-outline-xl" style={{ width: "100%", marginTop: 10 }} onClick={() => doRemove(true)} disabled={busy}>REMOVE ALL — {fmtQty(sel.qty)}</button>
        </div>
      )}
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════════════════════
   INBOUND — receive raw materials & packaging against a PO
══════════════════════════════════════════════════════════════════════════ */
function SignaturePad({ onChange }) {
  const cvRef = useRef(null);
  const drawing = useRef(false);
  const last = useRef(null);
  const pos = (e) => {
    const c = cvRef.current, r = c.getBoundingClientRect();
    const t = e.touches ? e.touches[0] : e;
    return { x: (t.clientX - r.left) * (c.width / r.width), y: (t.clientY - r.top) * (c.height / r.height) };
  };
  const start = (e) => { e.preventDefault(); drawing.current = true; last.current = pos(e); };
  const move  = (e) => {
    if (!drawing.current) return;
    e.preventDefault();
    const c = cvRef.current.getContext("2d"), p = pos(e);
    c.strokeStyle = "#111"; c.lineWidth = 2.5; c.lineCap = "round";
    c.beginPath(); c.moveTo(last.current.x, last.current.y); c.lineTo(p.x, p.y); c.stroke();
    last.current = p;
    onChange(cvRef.current.toDataURL("image/png"));
  };
  const end = () => { drawing.current = false; };
  const clear = () => {
    const c = cvRef.current.getContext("2d");
    c.clearRect(0, 0, cvRef.current.width, cvRef.current.height);
    onChange("");
  };
  return (
    <div>
      <canvas ref={cvRef} width={460} height={150}
        style={{ width: "100%", height: 150, background: "#fff", borderRadius: 8, touchAction: "none", border: "2px solid #333" }}
        onMouseDown={start} onMouseMove={move} onMouseUp={end} onMouseLeave={end}
        onTouchStart={start} onTouchMove={move} onTouchEnd={end} />
      <button className="btn-ghost-sm" style={{ marginTop: 6 }} onClick={clear}>CLEAR SIGNATURE</button>
    </div>
  );
}

function InboundFlow({ session, products, floorStock, setFloorStock, addLog, showToast, onDone, skipNextSync }) {
  const [step, setStep]   = useState("po");     // po | pickline | form
  const [poIn, setPoIn]   = useState("");
  const [po, setPo]       = useState("");
  const [lines, setLines] = useState([]);
  const [manual, setManual] = useState(false);
  const [line, setLine]   = useState({ supplier: "", code: "", name: "", qty: "" });
  const [palletType, setPalletType] = useState("Chep");
  const [uom, setUom]           = useState("Units");   // Kg | Litres | Units | Ctns
  const [pallets, setPallets]   = useState("");
  const [carrier, setCarrier]   = useState("");
  const [chk, setChk]     = useState({ quality: false, docket: false, qcount: false });
  const [site, setSite]   = useState("Dandenong");
  const [sig, setSig]     = useState("");
  const [error, setError] = useState("");
  const [busy, setBusy]   = useState(false);
  const poRef = useRef(null);
  useEffect(() => { if (step === "po") setTimeout(() => poRef.current?.focus(), 80); }, [step]);

  const todayISO = (() => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); })();

  const openPO = async () => {
    const p = String(poIn).replace(/[\r\n\t\s]/g, "");
    if (!p) return;
    setBusy(true); setError("");
    try {
      const r = await GS.getPO(p);
      if (!r || !r.ok) { setError(r?.error || "PO not found."); setBusy(false); return; }
      setPo(p); setManual(false);
      if (r.lines.length === 1) { setLine({ ...r.lines[0], qty: String(r.lines[0].qty) }); setStep("form"); }
      else { setLines(r.lines); setStep("pickline"); }
    } catch (e) { setError(e.message); }
    finally { setBusy(false); }
  };

  const startManual = () => {
    setPo(String(poIn).trim()); setManual(true);
    setLine({ supplier: "", code: "", name: "", qty: "" });
    setStep("form"); setError("");
  };

  const printLabels = (n, code, batch, qty, uomLabel) => {
    // Hidden iframe instead of window.open: pop-up blockers kill window.open
    // after an await, which is why printing only worked some of the time.
    document.querySelectorAll("iframe[data-labels]").forEach(f => f.remove());
    const fr = document.createElement("iframe");
    fr.setAttribute("data-labels", "1");
    fr.style.cssText = "position:fixed;right:0;bottom:0;width:0;height:0;border:0;visibility:hidden";
    document.body.appendChild(fr);

    const qtyLine = (qty !== undefined && qty !== null && qty !== "") ? `<div class="q">${fmtQty(qty)} ${uomLabel || ""}</div>` : "";
    const one = `<div class="lb"><div class="c">${code}</div>${qtyLine}<div class="d">Received: ${fmtBatch(batch)}</div><svg class="bc"></svg></div>`;
    const doc = fr.contentDocument || fr.contentWindow.document;
    doc.open();
    doc.write(`<html><head><title>Labels ${code}</title>
      <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"><\/script>
      <style>
        @page{size:landscape;margin:0}
        html,body{font-family:Arial,sans-serif;margin:0;padding:0}
        .lb{page-break-after:always;width:100vw;height:100vh;box-sizing:border-box;padding:4vh 4vw;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
        .c{font-size:9vh;font-weight:800;letter-spacing:2px;line-height:1.05}
        .q{font-size:7vh;font-weight:800;margin-top:1vh}
        .d{font-size:5vh;margin:1vh 0 2vh}
        .bc{width:88vw;height:30vh}
      </style></head><body>${Array(n).fill(one).join("")}
      <script>
        function go(){
          try {
            document.querySelectorAll(".bc").forEach(el => JsBarcode(el, ${JSON.stringify(code + "|" + fmtBatch(batch))}, { format: "CODE128", displayValue: true, fontSize: 18, height: 70 }));
          } catch(e) {}
          setTimeout(function(){ window.focus(); window.print(); }, 300);
        }
        if (document.readyState === "complete") go(); else window.onload = go;
      <\/script></body></html>`);
    doc.close();
    // Remove the iframe after printing so repeated receipts don't stack up.
    setTimeout(() => { try { fr.remove(); } catch(e) {} }, 60000);
  };

  const save = async () => {
    if (!line.code.trim() || !line.name.trim()) { setError("Product code and name are needed."); return; }
    const q = parseFloat(line.qty);
    if (!q || q <= 0) { setError("Quantity must be more than zero."); return; }
    const np = parseInt(pallets);
    if (!np || np <= 0) { setError("Enter the number of pallets."); return; }
    if (!carrier.trim()) { setError("Enter the carrier name."); return; }
    if (!chk.quality || !chk.docket || !chk.qcount) { setError("All three checks must be ticked."); return; }
    if (!sig) { setError("Driver signature is needed."); return; }

    setBusy(true); setError("");
    try {
      const r = await GS.inboundSave({
        po, supplier: line.supplier, code: line.code.trim().toUpperCase(), name: line.name.trim(),
        qty: q, uom, palletType, pallets: np, carrier: carrier.trim(),
        chkQuality: chk.quality, chkDocket: chk.docket, chkQty: chk.qcount,
        site, user: session.username, batchDate: todayISO, signature: sig,
      });
      if (!r || !r.ok) throw new Error(r?.error || "Couldn't save");
      if (skipNextSync) skipNextSync();
      setFloorStock(prev => {
        const items = [...(prev[site] || [])];
        const i = items.findIndex(it => String(it.productCode).toUpperCase() === line.code.trim().toUpperCase() && (it.bestBefore || "") === todayISO);
        if (i >= 0) items[i] = { ...items[i], qty: items[i].qty + q };
        else items.push({ productCode: line.code.trim().toUpperCase(), description: line.name.trim(), qty: q, bestBefore: todayISO, storedAt: new Date().toISOString() });
        return { ...prev, [site]: items };
      });
      addLog("INBOUND", `PO:${po || "—"} | ${line.code} | Qty:${fmtQty(q)} ${uom} → FLOOR ${WH_LABEL(site)} | Batch:${fmtBatch(todayISO)}`, session.username);
      showToast(`✓ Received ${fmtQty(q)} ${uom} onto ${WH_LABEL(site)} floor`);
      printLabels(np, line.code.trim().toUpperCase(), todayISO, q, uom);
      onDone();
    } catch (e) { setError(e.message); }
    finally { setBusy(false); }
  };

  const ro = { background: "#161616", color: "#bbb" };   // read-only look
  const lockField = !manual;

  return (
    <div>
      <StepBar steps={["PO","DETAILS","SAVE"]} current={{po:0,pickline:1,form:1}[step]} color={"#78BE20"} />

      {step === "po" && (
        <div style={{ animation: "fadeUp .2s ease" }}>
          <SectionTitle icon="📥" color={"#78BE20"} title="Inbound Receipt" sub="Type or scan the PO number" />
          <input ref={poRef} className="inp-dark" placeholder="PO number" value={poIn}
            onChange={e => { setPoIn(e.target.value); setError(""); }}
            onKeyDown={e => e.key === "Enter" && openPO()} />
          {error && <ErrBox msg={error} />}
          <button className="btn-green-xl" style={{ width: "100%", marginTop: 14 }} onClick={openPO} disabled={busy}>{busy ? "LOADING…" : "OPEN PO"}</button>
          <button className="btn-outline-xl" style={{ width: "100%", marginTop: 10 }} onClick={startManual}>ENTER DETAILS MANUALLY</button>
        </div>
      )}

      {step === "pickline" && (
        <div style={{ animation: "fadeUp .2s ease" }}>
          <button onClick={() => setStep("po")} style={{ background: "none", border: "none", color: G.amber, fontSize: 14, fontWeight: 700, cursor: "pointer", padding: "0 0 12px" }}>‹ BACK</button>
          <SectionTitle icon="📥" color={"#78BE20"} title={`PO ${po}`} sub="Which line are you receiving?" />
          <div style={{ display: "grid", gap: 8 }}>
            {lines.map((l, i) => (
              <button key={i} onClick={() => { setLine({ ...l, qty: String(l.qty) }); setStep("form"); }}
                style={{ width: "100%", background: "#1a1a1a", border: "2px solid #2a2a2a", borderRadius: 10, padding: "13px 15px", cursor: "pointer", textAlign: "left", display: "flex", alignItems: "center", gap: 12 }}>
                <div style={{ flex: 1 }}>
                  <div style={{ fontFamily: "monospace", color: G.amber, fontSize: 13, fontWeight: 700 }}>{l.code}</div>
                  <div style={{ color: "#fff", fontWeight: 700, fontSize: 15 }}>{l.name}</div>
                </div>
                <div style={{ color: "#fff", fontWeight: 800, fontSize: 20 }}>{fmtQty(l.qty)}</div>
              </button>
            ))}
          </div>
        </div>
      )}

      {step === "form" && (
        <div style={{ animation: "fadeUp .2s ease" }}>
          <button onClick={() => setStep("po")} style={{ background: "none", border: "none", color: G.amber, fontSize: 14, fontWeight: 700, cursor: "pointer", padding: "0 0 12px" }}>‹ BACK</button>
          <div style={{ background: "#1e1e1e", border: "1px solid #2a2a2a", borderRadius: 8, padding: "12px 14px", marginBottom: 14, display: "flex", justifyContent: "space-between" }}>
            <div><div style={{ fontSize: 11, color: "#666", letterSpacing: 1 }}>PO</div><div style={{ color: "#fff", fontWeight: 800, fontSize: 17, fontFamily: "monospace" }}>{po || "—"}</div></div>
            <div style={{ textAlign: "right" }}><div style={{ fontSize: 11, color: "#666", letterSpacing: 1 }}>BATCH DATE</div><div style={{ color: "#78BE20", fontWeight: 800, fontSize: 17 }}>{fmtBatch(todayISO)}</div></div>
          </div>

          <label className="lbl-dark">SUPPLIER</label>
          <input className="inp-dark" style={lockField ? ro : {}} readOnly={lockField} value={line.supplier}
            onChange={e => setLine(l => ({ ...l, supplier: e.target.value }))} placeholder={manual ? "Supplier name" : ""} />
          <label className="lbl-dark" style={{ marginTop: 10 }}>PRODUCT CODE</label>
          <input className="inp-dark" style={lockField ? ro : {}} readOnly={lockField} value={line.code}
            onChange={e => setLine(l => ({ ...l, code: e.target.value }))} placeholder={manual ? "Code" : ""} />
          <label className="lbl-dark" style={{ marginTop: 10 }}>PRODUCT NAME</label>
          <input className="inp-dark" style={lockField ? ro : {}} readOnly={lockField} value={line.name}
            onChange={e => setLine(l => ({ ...l, name: e.target.value }))} placeholder={manual ? "Name" : ""} />
          <label className="lbl-dark" style={{ marginTop: 10 }}>QUANTITY</label>
          <input className="inp-dark" style={lockField ? ro : {}} readOnly={lockField} inputMode="decimal" value={line.qty}
            onChange={e => setLine(l => ({ ...l, qty: e.target.value }))} placeholder={manual ? "0" : ""} />

          <label className="lbl-dark" style={{ marginTop: 14 }}>UNIT OF MEASURE</label>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>
            {["Kg","Litres","Units","Ctns"].map(u => (
              <button key={u} onClick={() => setUom(u)}
                style={{ padding: "12px", background: uom === u ? "#1d2e08" : "#1a1a1a", border: `2px solid ${uom === u ? "#78BE20" : "#2a2a2a"}`, borderRadius: 8, cursor: "pointer", color: "#fff", fontWeight: 800, fontSize: 15 }}>{u.toUpperCase()}</button>
            ))}
          </div>

          <label className="lbl-dark" style={{ marginTop: 14 }}>PALLET TYPE</label>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>
            {["Chep","Loscam","Plain","Plastic"].map(t => (
              <button key={t} onClick={() => setPalletType(t)}
                style={{ padding: "12px", background: palletType === t ? "#1d2e08" : "#1a1a1a", border: `2px solid ${palletType === t ? "#78BE20" : "#2a2a2a"}`, borderRadius: 8, cursor: "pointer", color: "#fff", fontWeight: 800, fontSize: 15 }}>{t.toUpperCase()}</button>
            ))}
          </div>

          <label className="lbl-dark" style={{ marginTop: 14 }}>NO. OF PALLETS</label>
          <input className="inp-dark" inputMode="numeric" placeholder="0" value={pallets} onChange={e => { setPallets(e.target.value); setError(""); }} />
          <label className="lbl-dark" style={{ marginTop: 10 }}>CARRIER NAME</label>
          <input className="inp-dark" placeholder="Carrier" value={carrier} onChange={e => { setCarrier(e.target.value); setError(""); }} />

          <div style={{ marginTop: 16, display: "grid", gap: 10 }}>
            {[["quality","Product has no damage and quality acceptable"],["docket","Product matches the delivery docket"],["qcount","Product quantity is correct"]].map(([k, label]) => (
              <label key={k} style={{ display: "flex", alignItems: "flex-start", gap: 10, cursor: "pointer", background: "#1a1a1a", border: `2px solid ${chk[k] ? "#78BE20" : "#2a2a2a"}`, borderRadius: 8, padding: "12px 14px" }}>
                <input type="checkbox" checked={chk[k]} onChange={e => { setChk(c => ({ ...c, [k]: e.target.checked })); setError(""); }}
                  style={{ width: 20, height: 20, accentColor: "#78BE20", flexShrink: 0, marginTop: 1 }} />
                <span style={{ color: "#fff", fontSize: 15, fontWeight: 600 }}>{label}</span>
              </label>
            ))}
          </div>

          <label className="lbl-dark" style={{ marginTop: 14 }}>DRIVER SIGNATURE</label>
          <SignaturePad onChange={setSig} />

          <label className="lbl-dark" style={{ marginTop: 14 }}>SITE — STOCK GOES TO THIS FLOOR</label>
          <div style={{ display: "grid", gap: 8 }}>
            {["Dandenong","Unit 2","Unit 6"].map(a => (
              <button key={a} onClick={() => setSite(a)}
                style={{ padding: "14px", background: site === a ? "#1d2e08" : "#1a1a1a", border: `2px solid ${site === a ? "#78BE20" : "#2a2a2a"}`, borderRadius: 8, cursor: "pointer", color: "#fff", fontWeight: 800, fontSize: 16, textAlign: "left" }}>{WH_LABEL(a).toUpperCase()}</button>
            ))}
          </div>

          {error && <ErrBox msg={error} />}
          <button className="btn-green-xl" style={{ width: "100%", marginTop: 16 }} onClick={save} disabled={busy}>
            {busy ? "SAVING…" : "SAVE & PRINT LABELS"}
          </button>
          <div style={{ color: "#555", fontSize: 12, textAlign: "center", marginTop: 8 }}>
            One label per pallet prints automatically.
          </div>
        </div>
      )}
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════════════════════
   ADD STOCK FLOW
══════════════════════════════════════════════════════════════════════════ */
/* ═══════════════════════════════════════════════════════════════════════════
   ADD STOCK — OPTIMISED (3 steps)
   1. Scan product → product shown + BB + Qty + quick-qty buttons on same screen
   2. Scan aisle → auto-selects bin if only 1 free; else tap bin
   3. Confirm (auto-skipped if auto-bin selected)
══════════════════════════════════════════════════════════════════════════ */
const QUICK_QTYS = [12, 24, 48, 96];

function AddStockFlow({ session, products, locations, setLocations, floorStock, setFloorStock, addLog, showToast, onDone, lockBin, unlockBin, isBinLocked, skipNextSync }) {
  const [step, setStep]               = useState("scan_product"); // scan_product | details_aisle | select_bin | floor_confirm
  const [productCode, setProductCode] = useState("");
  const [foundProduct, setFoundProduct] = useState(null);
  const [bestBefore, setBestBefore]   = useState("");
  const [qty, setQty]                 = useState("");
  const [aisleCode, setAisleCode]     = useState(() => LS.get("kw_last_aisle","") || "");
  const [aisleBins, setAisleBins]     = useState([]);
  const [selectedBin, setSelectedBin] = useState(null);
  const [floorWarehouse, setFloorWarehouse] = useState(null);
  const [error, setError]             = useState("");
  const productRef = useRef(null);
  const aisleRef   = useRef(null);
  const qtyRef     = useRef(null);

  useEffect(() => { if (step === "scan_product") setTimeout(() => productRef.current?.focus(), 80); }, [step]);
  useEffect(() => { if (step === "details_aisle") setTimeout(() => qtyRef.current?.focus(), 80); }, [step]);

  const lookupProduct = (code) => {
    const clean = String(code||"").replace(/[\r\n\t\s]/g,"").trim();
    const p = findProduct(products, clean);
    if (p) { setFoundProduct(p); setError(""); setStep("details_aisle"); }
    else { setError(`Not found: "${clean}" (${clean.length} chars). Try product code or barcode.`); setProductCode(""); }
  };

  const lookupAisle = (code) => {
    const c = code.trim().toUpperCase();
    const bins = Object.values(locations).filter(l => l.id.startsWith(c));
    if (!bins.length) { setError(`Aisle "${c}" not found.`); return; }
    const freeBins = bins.filter(l => distinctProducts(l) < l.maxProducts || l.contents.find(x => x.productCode === foundProduct?.code));
    if (!freeBins.length) { setError(`No space in aisle "${c}". Try another.`); return; }
    LS.set("kw_last_aisle", c);
    setAisleBins(bins.sort((a,b) => a.id.localeCompare(b.id)));
    setError("");
    // Auto-select if only 1 free bin
    if (freeBins.length === 1) { setSelectedBin(freeBins[0].id); submitStore(freeBins[0].id, bins); }
    else { setStep("select_bin"); }
  };

  const submitDetails = () => {
    if (!qty || parseInt(qty) <= 0) { setError("Enter quantity."); return; }
    if (!bestBefore) { setError("Enter best before date."); return; }
    setError("");
    // Scan aisle inline if typed
    if (aisleCode.trim()) { lookupAisle(aisleCode); }
    else { setError("Scan or type the aisle code."); setTimeout(() => aisleRef.current?.focus(), 50); }
  };

  const submitStore = (binId, bins) => {
    const locs = bins || aisleBins;
    const loc = locations[binId] || locs.find(l => l.id === binId);
    if (!loc) return;
    const lockedBy = isBinLocked ? isBinLocked(binId) : false;
    if (lockedBy) { showToast(`⚠ Bin ${binId} is in use by ${lockedBy}`, "err"); return; }
    if (lockBin) lockBin(binId);
    // Match by BOTH productCode AND bestBefore date — different BB = separate entry
    const exactMatch = loc.contents.findIndex(c => c.productCode === foundProduct.code && c.bestBefore === bestBefore);
    // Count distinct product codes for slot limit check
    const distinctCodes = new Set(loc.contents.map(c => c.productCode));
    const isNewProduct = !distinctCodes.has(foundProduct.code);
    if (exactMatch < 0 && isNewProduct && distinctCodes.size >= loc.maxProducts) {
      showToast(`Bin ${loc.id} is full`, "err"); return;
    }
    (async () => {
      const r = await stockCall(GS.stockAdd, { target: loc.id, partNo: foundProduct.code, description: foundProduct.description, bb: bestBefore, qty: parseInt(qty) });
      if (!r.ok) { showToast("Not saved — " + r.error, "err"); if (unlockBin) unlockBin(loc.id); return; }
      if (skipNextSync) skipNextSync();
      if (exactMatch >= 0) {
        const newContents = loc.contents.map((c,i) => i === exactMatch ? { ...c, qty: c.qty + parseInt(qty) } : c);
        setLocations(prev => ({ ...prev, [loc.id]: { ...loc, contents: newContents } }));
      } else {
        const newContents = [...loc.contents, { productCode: foundProduct.code, description: foundProduct.description, qty: parseInt(qty), bestBefore, storedAt: new Date().toISOString() }];
        setLocations(prev => ({ ...prev, [loc.id]: { ...loc, contents: newContents } }));
      }
      addLog("STORE", `${foundProduct.description} (${foundProduct.code}) → ${loc.id} | Qty:${qty} | BB:${bestBefore}`, session.username);
      if (unlockBin) unlockBin(loc.id);
      showToast(`✓ Stored ${qty} ctns at ${loc.id}`);
      onDone();
    })();
  };

  const confirmFloor = (wh) => { setFloorWarehouse(wh); setStep("floor_confirm"); };

  const saveToFloor = () => {
    (async () => {
      const r = await stockCall(GS.stockAdd, { target: "FLOOR:" + floorWarehouse, partNo: foundProduct.code, description: foundProduct.description, bb: bestBefore, qty: parseInt(qty) });
      if (!r.ok) { showToast("Not saved — " + r.error, "err"); return; }
      if (skipNextSync) skipNextSync();
      const entry = { productCode: foundProduct.code, description: foundProduct.description, qty: parseInt(qty), bestBefore, storedAt: new Date().toISOString() };
      setFloorStock(prev => ({ ...prev, [floorWarehouse]: [...(prev[floorWarehouse] || []), entry] }));
      addLog("FLOOR_STORE", `${foundProduct.description} → FLOOR/${floorWarehouse} | Qty:${qty} | BB:${bestBefore}`, session.username);
      showToast(`✓ Stored on ${floorWarehouse} floor`);
      onDone();
    })();
  };

  const STEP_LABELS = ["SCAN PRODUCT", "DETAILS + AISLE", "SELECT BIN"];
  const stepIdx = { scan_product:0, details_aisle:1, select_bin:2, floor_confirm:1 }[step] ?? 0;

  return (
    <div>
      <StepBar steps={STEP_LABELS} current={stepIdx} color={G.green} />

      {/* ── STEP 1: Scan product ── */}
      {step === "scan_product" && (
        <div style={{ animation:"fadeUp .2s ease" }}>
          <SectionTitle icon="↓" color={G.green} title="Scan or Search Product" sub="Scan barcode — or type product code manually" />
          <input ref={productRef} className="inp-dark"
            style={{ fontWeight:800, fontSize:22, letterSpacing:2, textAlign:"center" }}
            placeholder="SCAN BARCODE" value={productCode}
            onChange={e => setProductCode(e.target.value)}
            onKeyDown={e => { if (e.key === "Enter" && productCode.trim()) lookupProduct(productCode); }}
            autoComplete="off" />
          <div style={{ display:"flex", alignItems:"center", gap:10, margin:"10px 0" }}>
            <div style={{ flex:1, height:1, background:"#2a2a2a" }}/><span style={{ color:"#555", fontSize:12, fontWeight:700 }}>OR</span><div style={{ flex:1, height:1, background:"#2a2a2a" }}/>
          </div>
          <ProductCodeSearch products={products} onSelect={p => { setFoundProduct(p); setProductCode(p.code); setError(""); setStep("details_aisle"); }} />
          {error && <ErrBox msg={error} />}
          <button className="btn-green-xl" style={{ width:"100%", marginTop:10 }}
            onClick={() => productCode.trim() && lookupProduct(productCode)}>LOOK UP →</button>
        </div>
      )}

      {/* ── STEP 2: Details + Aisle (merged) ── */}
      {step === "details_aisle" && foundProduct && (
        <div style={{ animation:"fadeUp .2s ease" }}>
          {/* Product card compact */}
          <div style={{ background:"#1a1a0a", border:`2px solid ${G.amber}`, borderRadius:10, padding:"12px 16px", marginBottom:16, display:"flex", justifyContent:"space-between", alignItems:"center" }}>
            <div>
              <div style={{ fontSize:11, color:G.amber, fontWeight:700, letterSpacing:1 }}>✓ PRODUCT</div>
              <div style={{ color:"#fff", fontWeight:800, fontSize:18, marginTop:2 }}>{foundProduct.description}</div>
              <div style={{ color:"#888", fontSize:12, fontFamily:"monospace" }}>{foundProduct.code}</div>
            </div>
            <button onClick={() => { setStep("scan_product"); setFoundProduct(null); setProductCode(""); }}
              style={{ background:"none", border:"1px solid #444", color:"#888", borderRadius:6, padding:"6px 12px", cursor:"pointer", fontFamily:"'Barlow Condensed',sans-serif", fontSize:13 }}>CHANGE</button>
          </div>

          {/* QTY + Quick buttons */}
          <label className="lbl-dark">QUANTITY (CTNS)</label>
          <input ref={qtyRef} className="inp-dark" type="number" min="1" value={qty}
            onChange={e => setQty(e.target.value)} placeholder="0"
            style={{ fontSize:28, fontWeight:800, textAlign:"center", minHeight:64 }} />
          <div style={{ display:"flex", gap:8, marginTop:8 }}>
            {QUICK_QTYS.map(q => (
              <button key={q} onClick={() => setQty(String(q))}
                style={{ flex:1, padding:"10px 0", background: qty===String(q) ? G.green : "#1e1e1e", border:`2px solid ${qty===String(q) ? G.green : "#333"}`, borderRadius:8, color: qty===String(q) ? "#fff" : "#888", fontWeight:800, fontSize:16, cursor:"pointer", fontFamily:"'Barlow Condensed',sans-serif", transition:"all .15s" }}>
                {q}
              </button>
            ))}
          </div>

          {/* Best before */}
          <label className="lbl-dark" style={{ marginTop:16 }}>BEST BEFORE DATE</label>
          <div style={{ background:"#1e1e1e", borderRadius:8, padding:"10px 12px" }}>
            <DatePicker value={bestBefore} onChange={setBestBefore} />
          </div>

          {/* Aisle inline */}
          <label className="lbl-dark" style={{ marginTop:16 }}>AISLE BARCODE</label>
          <div style={{ display:"flex", gap:8 }}>
            <input ref={aisleRef} className="inp-dark"
              style={{ flex:1, textTransform:"uppercase", fontWeight:800, fontSize:22, letterSpacing:4, textAlign:"center" }}
              placeholder="J01" value={aisleCode}
              onChange={e => setAisleCode(e.target.value.toUpperCase())}
              onKeyDown={e => { if (e.key === "Enter") submitDetails(); }}
              autoComplete="off" />
            {aisleCode && <div style={{ display:"flex", alignItems:"center", background:"#1a1a0a", border:`1px solid ${G.amber}`, borderRadius:8, padding:"0 12px", color:G.amber, fontSize:11, fontWeight:700, letterSpacing:1, whiteSpace:"nowrap" }}>LAST: {aisleCode}</div>}
          </div>
          {error && <ErrBox msg={error} />}

          <button className="btn-green-xl" style={{ width:"100%", marginTop:14 }} onClick={submitDetails}>
            CHECK AISLE + SAVE →
          </button>

          {/* Floor divider */}
          <div style={{ display:"flex", alignItems:"center", gap:10, margin:"14px 0 10px" }}>
            <div style={{ flex:1, height:1, background:"#2a2a2a" }} />
            <span style={{ color:"#555", fontSize:13, fontWeight:700 }}>OR STORE ON FLOOR</span>
            <div style={{ flex:1, height:1, background:"#2a2a2a" }} />
          </div>
          <FloorWarehousePicker onSelect={confirmFloor} />
          <button className="btn-outline-xl" style={{ width:"100%", marginTop:12 }}
            onClick={() => { setStep("scan_product"); setFoundProduct(null); setProductCode(""); }}>← BACK</button>
        </div>
      )}

      {/* ── STEP 3: Select bin (only if multiple free bins) ── */}
      {step === "select_bin" && (
        <div style={{ animation:"fadeUp .2s ease" }}>
