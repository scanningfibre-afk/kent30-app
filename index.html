  <script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

/* ─── STYLES ────────────────────────────────────────────────────────────── */

  surface: "#ffffff",
  border: "#e0e0dc",
  amber: "#E8A000",
  amberDark: "#c48600",
  amberLight: "#fff8e6",

  muted: "#888",
  green: "#16a34a",
  greenLight: "#f0fdf4",
  red: "#dc2626",
  redLight: "#fef2f2",
  yellow: "#d97706",
  yellowLight: "#fffbeb",

/* ─── INITIAL DATA ──────────────────────────────────────────────────────── */
const INIT_PRODUCTS = [
  { code: "P001", barcode: "9300675012345", description: "Heinz Baked Beans 400g", category: "Canned Goods" },
  { code: "P002", barcode: "9300675023456", description: "Coca Cola 330ml Can", category: "Beverages" },
  { code: "P003", barcode: "9300675034567", description: "Kellogg Corn Flakes 500g", category: "Cereals" },
  { code: "P004", barcode: "9300675045678", description: "Nestle Milo 1kg", category: "Beverages" },
  { code: "P005", barcode: "9300675056789", description: "Uncle Tobys Oats 1kg", category: "Cereals" },
];

// Look up product by barcode OR product code
function findProduct(products, input) {
  if (!input || !products) return null;
  // Strip ALL whitespace, newlines, carriage returns and invisible chars
  const clean = String(input).replace(/[\r\n\t\s]/g, "").trim();
  const q = clean.toUpperCase();
  return products.find(p => {
    if (!p) return false;
    const barcode = String(p.barcode || "").replace(/[\r\n\t\s]/g, "").trim();
    const code = String(p.code || "").replace(/[\r\n\t\s]/g, "").trim().toUpperCase();
    return barcode === clean || barcode === q || code === q;
  });
}

// Rack J: J01–J05, each with slots A–E
function buildInitLocations() {
  const locs = {};
  ["J","K","L"].forEach(rack => {
    for (let row = 1; row <= 5; row++) {
      ["A","B","C","D","E"].forEach(slot => {
        const id = `${rack}0${row}${slot}`;
        locs[id] = { id, rack, row, slot, maxProducts: 2, contents: [], allowedProducts: [], customName: "" };
      });
    }
  });
  // Seed some demo stock
  locs["J01A"].contents = [
    { productCode:"P001", description:"Heinz Baked Beans 400g", qty:30, bestBefore:"2026-12-01", storedAt: new Date().toISOString() }
  ];
  locs["J01B"].contents = [
    { productCode:"P002", description:"Coca Cola 330ml Can", qty:20, bestBefore:"2027-03-15", storedAt: new Date().toISOString() },
    { productCode:"P003", description:"Kellogg Corn Flakes 500g", qty:15, bestBefore:"2026-09-30", storedAt: new Date().toISOString() },
  ];
  return locs;
}

const INIT_USERS = {
  admin: { username: "admin", password: "admin123", role: "admin", name: "Admin" },
  picker1: { username: "picker1", password: "pick123", role: "picker", name: "Picker 1" },
  picker2: { username: "picker2", password: "pick456", role: "picker", name: "Picker 2" },
};

/* ─── CONFIG — paste your Google Apps Script URL here after setup ─────── */
const GS_URL = localStorage.getItem("kw_gs_url") || "";

/* ─── LOCAL CACHE (keeps app fast between syncs) ─────────────────────── */
const LS = {
  get: (k, def) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : def; } catch { return def; } },
  set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};

/* ─── GOOGLE SHEETS API LAYER ─────────────────────────────────────────── */
const GS = {
  configured: () => !!GS_URL,

  call: async (action, payload = {}) => {
    if (!GS_URL) throw new Error("Google Sheets not configured");
    const res = await fetch(GS_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain" },
      body: JSON.stringify({ action, ...payload }),
    });
    const text = await res.text();
    try { return JSON.parse(text); }
    catch { throw new Error("Bad response: " + text.slice(0, 200)); }
  },

  // Load all data from Sheets
  loadAll: async () => {
    const r = await GS.call("loadAll");
    // Old rows may hold Date objects that arrive as long GMT strings —
    // normalise every best-before to yyyy-mm-dd once, at load.
    if (r && r.locations) Object.values(r.locations).forEach(loc => {
      (loc.contents || []).forEach(c => { c.bestBefore = normDate(c.bestBefore); });
    });
    if (r && r.floorStock) Object.values(r.floorStock).forEach(items => {
      (items || []).forEach(it => { it.bestBefore = normDate(it.bestBefore); });
    });
    return r;
  },

  // Save entire state snapshot
  saveAll: async (data) => {
    return await GS.call("saveAll", { data });
  },

  // Append a log entry
  appendLog: async (entry) => {
    return await GS.call("appendLog", { entry });
  },

  /* ─── STAGE 2: PICK ORDERS ───────────────────────────────────────────
     These bypass saveAll completely. saveAll writes the whole state
     snapshot and last-write-wins; order picking must not work that way.
     Each action below touches only its own rows, under a script lock. */

  importOrders: async (rows, closeMissing) =>
    await GS.call("importOrders", { rows, closeMissing }),

  listOrders:   async ()                  => await GS.call("listOrders"),
  getOrder:     async (invoiceNo)         => await GS.call("getOrder",     { invoiceNo }),
  claimOrder:   async (invoiceNo, user)   => await GS.call("claimOrder",   { invoiceNo, user }),
  releaseOrder: async (invoiceNo, user)   => await GS.call("releaseOrder", { invoiceNo, user }),
  pickLine:     async (payload)           => await GS.call("pickLine",     payload),
  unpickLine:   async (payload)           => await GS.call("unpickLine",   payload),
  setBlock:     async (payload)           => await GS.call("setBlock",     payload),
  stockAdd:     async (payload)           => await GS.call("stockAdd",     payload),
  stockRemove:  async (payload)           => await GS.call("stockRemove",  payload),
  stockMove:    async (payload)           => await GS.call("stockMove",    payload),
  locWrite:     async (loc, preserveContents) => await GS.call("locWrite",  { loc, preserveContents }),
  locDelete:    async (id)                => await GS.call("locDelete",     { id }),
  importPOs:    async (rows)              => await GS.call("importPOs",     { rows }),
  getPO:        async (po)                => await GS.call("getPO",         { po }),
  inboundSave:  async (payload)           => await GS.call("inboundSave",   payload),
};

/* Warehouse display names — "Dandenong" stays as the internal key in Sheets,
   but the person sees "Main site". */
const WH_LABEL = (w) => (w === "Dandenong" ? "Main site" : w);

/* Which area a bin belongs to, derived from its ID prefix. */
const binArea = (id) => {
  const u = String(id || "").toUpperCase();
  if (u.indexOf("U2") === 0) return "Unit 2";
  if (u.indexOf("U6") === 0) return "Unit 6";
  return "Dandenong";
};

/* Batch date shown the warehouse way: 02Aug26 */
const MONTHS3 = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const fmtBatch = (iso) => {
  const m = String(iso || "").match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (!m) return String(iso || "—");
  return m[3] + MONTHS3[parseInt(m[2],10)-1] + m[1].slice(2);
};

/* Targeted write with graceful fallback: when Sheets isn't configured the
   flows still work locally (demo mode); when the server rejects, the local
   change is NOT applied and the person sees why. */
async function stockCall(fn, payload) {
  if (!GS.configured()) return { ok: true, offline: true };
  try { const r = await fn(payload); return r && r.ok ? r : { ok: false, error: r?.error || "Server said no" }; }
  catch (e) { return { ok: false, error: e.message }; }
}

/* ─── ORDER IMPORT SETTINGS (editable in Admin → Orders) ──────────────── */
const ORDER_DEFAULTS = {
  site: "Dandenong",          // IN_Logical.Description — Site 30 only
  headerSearchRows: 15,       // header row is row 4, not row 1
};
const getOrderSettings = () => ({ ...ORDER_DEFAULTS, ...LS.get("kw_order_settings", {}) });
const setOrderSettings = (s) => LS.set("kw_order_settings", s);

/* Column names in the SAP backorder export, with fallbacks.
   First match wins; matching is case/space/punctuation-insensitive. */
const SAP_COLUMNS = {
  invoiceNo:   ["InvoiceNo", "Invoice No", "Invoice Number"],
  invoiceDate: ["InvoiceInitDate", "Invoice Init Date", "InvoiceDate"],
  customerPO:  ["OrderNo", "Order No", "Customer PO"],
  dueDate:     ["ExpectedDeliveryDate", "Expected Delivery Date"],
  customer:    ["DB_Main(DebtorID).Name", "DB_Main(ParentDebtorID).Name", "Customer"],
  site:        ["IN_Logical.Description", "Site", "Warehouse"],
  partNo:      ["SO_History.SO_Lines.PartNo", "PartNo", "Part No", "Product Code"],
  description: ["SO_History.SO_Lines.Description", "Description"],
  reqQty:      ["Qty on Backorder", "QtyOnBackorder"],   // NOT Qty Ordered
  qtyOrdered:  ["Qty Ordered", "QtyOrdered"],
  qtyDelivered:["Sum Qty Delivered", "SumQtyDelivered"],
};

const normHeader = (h) => String(h || "").replace(/[\s_]/g, "").toLowerCase();

/* Finds the header row (row 4 in your file) and maps our fields to column indexes. */
function mapSapColumns(grid, maxRows) {
  for (let r = 0; r < Math.min(maxRows, grid.length); r++) {
    const row = (grid[r] || []).map(normHeader);
    if (!row.length) continue;
    const map = {};
    Object.entries(SAP_COLUMNS).forEach(([field, names]) => {
      for (const n of names) {
        const idx = row.indexOf(normHeader(n));
        if (idx !== -1) { map[field] = idx; break; }
      }
    });
    // A real header row must carry at least the invoice number and the part number
    if (map.invoiceNo !== undefined && map.partNo !== undefined) {
      return { headerRow: r, map, headers: grid[r] };
    }
  }
  return null;
}

/* SAP dates arrive as Excel serial numbers, Date objects or dd-mm-yy strings. */
function normDate(v) {
  if (v === null || v === undefined || v === "") return "";
  // Format in LOCAL time — toISOString() shifts Melbourne dates back a day.
  const local = (d) => isNaN(d.getTime()) ? "" :
    d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  if (v instanceof Date) return local(v);
  if (typeof v === "number") {
    return local(new Date(Math.round((v - 25569) * 86400 * 1000)));
  }
  const s = String(v).trim();
  if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;              // already clean
  const m = s.match(/^(\d{1,2})[-/](\d{1,2})[-/](\d{2,4})$/); // dd-mm-yy(yy)
  if (m) {
    let [, d, mo, y] = m;
    if (y.length === 2) y = "20" + y;
    return `${y}-${String(mo).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
  }
  // ISO with time (how Apps Script sends Dates) or long GMT strings
  if (/^\d{4}-\d{2}-\d{2}T/.test(s) || /GMT|UTC/.test(s)) {
    const t = new Date(s);
    if (!isNaN(t.getTime())) return local(t);
  }
  return s;
}

const toNum = (v) => {
  if (v === null || v === undefined || v === "") return 0;
  const n = parseFloat(String(v).replace(/[^0-9.\-]/g, ""));
  return isNaN(n) ? 0 : n;
};

/* Quantities can be decimal (0.5 sample lines). Never round these. */
/* Bins are limited by DISTINCT products, not batch entries — the same
   product with two best-before dates uses one slot, not two. Every FULL
   badge and slot square must use this, or the display disagrees with the
   storing rule. */
const distinctProducts = (loc) => new Set((loc.contents || []).map(c => c.productCode)).size;

const fmtQty = (n) => {
  const x = Number(n) || 0;
  return Number.isInteger(x) ? String(x) : String(parseFloat(x.toFixed(3)));
};

/* ─── BARCODE SVG ────────────────────────────────────────────────────────── */
function Barcode({ value, width = 200, height = 56 }) {
  if (!value) return null;
  const seed = value.split("").reduce((a, c) => a + c.charCodeAt(0), 0);
  const bars = []; let x = 0;
  for (let i = 0; i < 56; i++) {
    const w = ((seed * (i + 7) * 13) % 3) + 1;
    if (i % 2 === 0) bars.push({ x, w });
    x += w + 1;
  }
  const scale = width / x;
  return (
    <svg width={width} height={height} style={{ display: "block", background: "#fff", borderRadius: 4 }}>
      {bars.map((b, i) => <rect key={i} x={b.x * scale} y={6} width={Math.max(1, b.w * scale)} height={height - 18} fill="#111" />)}
      <text x={width / 2} y={height - 2} textAnchor="middle" fontSize="9" fontFamily="monospace" fill="#444">{value}</text>
    </svg>
  );
}

/* ═══════════════════════════════════════════════════════════════════════════
   ROOT
══════════════════════════════════════════════════════════════════════════ */
const WAREHOUSES_CONST = ["Dandenong", "Unit 2", "Unit 6"];

function buildInitFloorStock() {
  const fs = {};
  WAREHOUSES_CONST.forEach(wh => { fs[wh] = []; });
  fs["Dandenong"] = [
    { productCode:"P002", description:"Coca Cola 330ml Can",     qty:40, bestBefore:"2027-06-01", storedAt: new Date().toISOString() },
    { productCode:"P002", description:"Coca Cola 330ml Can",     qty:25, bestBefore:"2026-08-15", storedAt: new Date().toISOString() },
    { productCode:"P004", description:"Nestle Milo 1kg",         qty:18, bestBefore:"2027-01-10", storedAt: new Date().toISOString() },
  ];
  fs["Unit 2"] = [
    { productCode:"P001", description:"Heinz Baked Beans 400g", qty:60, bestBefore:"2026-11-30", storedAt: new Date().toISOString() },
  ];
  return fs;
}

function App() {
  const [session,    setSession]    = useState(() => LS.get("kw_session", null));
  const [products,   setProducts]   = useState(() => LS.get("kw_products",  INIT_PRODUCTS));
  const [locations,  setLocations]  = useState(() => LS.get("kw_locations", buildInitLocations()));
  const [users,      setUsers]      = useState(() => LS.get("kw_users",     INIT_USERS));
  const [logs,       setLogs]       = useState(() => LS.get("kw_logs",      []));
  const [floorStock, setFloorStock] = useState(() => LS.get("kw_floor",     buildInitFloorStock()));
  const [syncing,    setSyncing]    = useState(false);
  const [syncStatus, setSyncStatus] = useState(null); // "ok" | "err" | null
  const [gsConfigured] = useState(() => !!localStorage.getItem("kw_gs_url"));
  const [lockedBins,  setLockedBins]  = useState({}); // { binId: { user, ts } }

  // ── Persist to localStorage (always, as fast local cache) ──
  useEffect(() => LS.set("kw_products",  products),           [products]);
  useEffect(() => LS.set("kw_locations", locations),          [locations]);
  useEffect(() => LS.set("kw_users",     users),              [users]);
  useEffect(() => LS.set("kw_logs",      logs.slice(0, 300)), [logs]);
  useEffect(() => LS.set("kw_floor",     floorStock),         [floorStock]);
  useEffect(() => {
    if (session) LS.set("kw_session", session);
    else localStorage.removeItem("kw_session");
  }, [session]);

  // ── Sync to Google Sheets — only after user actions, not on startup ──
  const syncTimer = useRef(null);
  const syncToSheets = useCallback((p, l, u, fs) => {
    if (!GS.configured()) return;
    clearTimeout(syncTimer.current);
    syncTimer.current = setTimeout(async () => {
      setSyncing(true);
      try {
        // Locations & FloorStock are written by targeted actions only —
        // a full snapshot from this device could be hours stale.
        await GS.saveAll({ products: p, users: u });
        setSyncStatus("ok");
        setTimeout(() => setSyncStatus(null), 2500);
      } catch (e) {
        console.error("Sync error:", e);
        setSyncStatus("err");
        setTimeout(() => setSyncStatus(null), 4000);
      } finally { setSyncing(false); }
    }, 1500);
  }, []);

  // Skip first render so app startup doesn't trigger a save to Sheets
  const isFirstRender = useRef(true);
  // Pick Orders deducts stock on the server. The local state change that
  // follows must NOT fire saveAll — that would push this device's stale
  // full snapshot over the top of what other pickers have just done.
  const suppressSync = useRef(false);
  const skipNextSync = useCallback(() => { suppressSync.current = true; }, []);
  useEffect(() => {
    if (isFirstRender.current) { isFirstRender.current = false; return; }
    if (suppressSync.current) { suppressSync.current = false; return; }
    syncToSheets(products, locations, users, floorStock);
  }, [products, locations, users, floorStock, syncToSheets]);

  // ── Load from Google Sheets on startup — Sheets is the master database ──
  // Data added directly in Google Sheets will always appear in the app
  useEffect(() => {
    if (!GS.configured()) return;
    (async () => {
      setSyncing(true);
      // Pause the sync watcher during load
      isFirstRender.current = true;
      try {
        const data = await GS.loadAll();
        // Always load from Sheets if it has data — Sheets is master
        if (data.products && Array.isArray(data.products) && data.products.length > 0) {
          // Remove duplicates — keep first occurrence of each product code
          const seen = new Set();
          const deduped = data.products.filter(p => {
            if (!p || !p.code) return false;
            const key = String(p.code).toUpperCase().trim();
            if (seen.has(key)) return false;
            seen.add(key);
            return true;
          });
          const dupCount = data.products.length - deduped.length;
          if (dupCount > 0) console.warn(`⚠ Removed ${dupCount} duplicate product(s) from Google Sheets`);
          setProducts(deduped);
          LS.set("kw_products", deduped);
        }
        if (data.locations && typeof data.locations === "object" && Object.keys(data.locations).length > 0) {
          setLocations(data.locations);
          LS.set("kw_locations", data.locations);
        }
        if (data.floorStock && typeof data.floorStock === "object") {
          setFloorStock(data.floorStock);
          LS.set("kw_floor", data.floorStock);
        }
        if (data.logs && Array.isArray(data.logs) && data.logs.length > 0) {
          setLogs(data.logs);
        }
        // Users: never overwrite if admin has changed password from default
        const localUsers = LS.get("kw_users", null);
        const hasCustomPassword = localUsers && Object.values(localUsers).some(u =>
          u.username === "admin" && u.password !== "admin123"
        );
        if (!hasCustomPassword && data.users && typeof data.users === "object" && Object.keys(data.users).length > 0) {
          setUsers(data.users);
          LS.set("kw_users", data.users);
        }
        setSyncStatus("ok");
        setTimeout(() => setSyncStatus(null), 2000);
      } catch (e) {
        console.error("Load error:", e);
        setSyncStatus("err");
      } finally {
        setSyncing(false);
        // Re-enable sync after load completes
        setTimeout(() => { isFirstRender.current = false; }, 500);
      }
    })();
  }, []);

  const addLog = useCallback((action, detail, user) => {
    const entry = { ts: new Date().toISOString(), action, detail, user };
    setLogs(l => [entry, ...l]);
    if (GS.configured()) GS.appendLog(entry).catch(console.error);
  }, []);

  const logout = () => {
    // Release any locks held by this user on logout
    setLockedBins(prev => {
      const next = {...prev};
      Object.keys(next).forEach(k => { if(next[k].user === session?.username) delete next[k]; });
      return next;
    });
    setSession(null);
  };

  const lockBin = (binId) => {
    if (!binId) return true;
    const lock = lockedBins[binId];
    if (lock && lock.user !== session?.username) {
      // Check if lock is stale (> 5 minutes)
      if (Date.now() - lock.ts < 5 * 60 * 1000) return false; // locked by someone else
    }
    setLockedBins(prev => ({ ...prev, [binId]: { user: session?.username, ts: Date.now() } }));
    return true;
  };

  const unlockBin = (binId) => {
    if (!binId) return;
    setLockedBins(prev => { const n={...prev}; delete n[binId]; return n; });
  };

  const isBinLocked = (binId) => {
    const lock = lockedBins[binId];
    if (!lock) return false;
    if (lock.user === session?.username) return false;
    if (Date.now() - lock.ts > 5 * 60 * 1000) return false; // stale lock
    return lock.user;
  };

  if (!session) return <LoginScreen users={users} onLogin={setSession} syncStatus={syncStatus} syncing={syncing} gsConfigured={gsConfigured} />;
  if (session.role === "admin") return <AdminApp session={session} products={products} setProducts={setProducts} locations={locations} setLocations={setLocations} users={users} setUsers={setUsers} logs={logs} floorStock={floorStock} setFloorStock={setFloorStock} addLog={addLog} logout={logout} syncing={syncing} syncStatus={syncStatus} skipNextSync={skipNextSync} />;
  return <PickerApp session={session} products={products} locations={locations} setLocations={setLocations} floorStock={floorStock} setFloorStock={setFloorStock} addLog={addLog} logout={logout} syncing={syncing} syncStatus={syncStatus} lockBin={lockBin} unlockBin={unlockBin} isBinLocked={isBinLocked} skipNextSync={skipNextSync} />;
}

/* ═══════════════════════════════════════════════════════════════════════════
   LOGIN
══════════════════════════════════════════════════════════════════════════ */
function LoginScreen({ users, onLogin }) {
  const [u, setU] = useState(""); const [p, setP] = useState(""); const [err, setErr] = useState("");
  const submit = () => {
    const user = Object.values(users).find(x => x.username === u.trim() && x.password === p);
    if (user) onLogin(user);
    else { setErr("Invalid username or password"); setTimeout(() => setErr(""), 2500); }
  };
  return (
    <div style={{ minHeight: "100vh", background: "#78BE20", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", fontFamily: "'Barlow Condensed',sans-serif", padding: 20 }}>
      <style>{css}</style>
      <div style={{ marginBottom: 32, textAlign: "center" }}>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 12, marginBottom: 8 }}>
          <BarcodeIcon />
          <span style={{ fontWeight: 800, fontSize: 28, color: "#fff", letterSpacing: 3 }}>KENTWW30</span>
        </div>
        <div style={{ color: "#fff", fontSize: 13, letterSpacing: 4, fontWeight: 700 }}>WAREHOUSE SYSTEM</div>
      </div>
      <div style={{ background: "#fff", borderRadius: 10, padding: "32px 28px", width: "100%", maxWidth: 380, boxShadow: "0 8px 40px rgba(0,0,0,.25)" }}>
        <div style={{ fontWeight: 800, fontSize: 20, marginBottom: 24, color: G.dark }}>Sign In</div>
        <label className="lbl">USERNAME</label>
        <input className="inp" value={u} onChange={e => setU(e.target.value)} onKeyDown={e => e.key === "Enter" && submit()} autoComplete="username" autoCapitalize="off" />
        <label className="lbl" style={{ marginTop: 14 }}>PASSWORD</label>
        <input className="inp" type="password" value={p} onChange={e => setP(e.target.value)} onKeyDown={e => e.key === "Enter" && submit()} autoComplete="current-password" />
        {err && <div style={{ color: G.red, fontSize: 13, fontWeight: 700, marginTop: 10 }}>{err}</div>}
        <button className="btn-amber" style={{ width: "100%", marginTop: 20, minHeight: 52, fontSize: 17 }} onClick={submit}>SIGN IN</button>

      </div>
    </div>
  );
}

/* ── Admin: Stock View ──────────────────────────────────────────────────── */
function AdminStock({ locations, products, floorStock }) {
  const [search, setSearch] = useState("");
  const [rack, setRack] = useState("All");
  const racks = ["All", "Floor", ...new Set(Object.values(locations).map(l => l.rack))];

  const rows = [];
  Object.values(locations).forEach(loc => {
    loc.contents.forEach(c => {
      rows.push({ loc: loc.id, rack: loc.rack, row: loc.row, slot: loc.slot, isFloor: false, ...c });
    });
  });
  Object.entries(floorStock || {}).forEach(([warehouse, items]) => {
    (items || []).forEach(c => {
      rows.push({ loc: "FLOOR · " + warehouse, rack: "Floor", row: "", slot: "", isFloor: true, ...c });
    });
  });

  const filtered = rows.filter(r => {
    const ms = !search || String(r.productCode||"").toLowerCase().includes(search.toLowerCase()) || String(r.description||"").toLowerCase().includes(search.toLowerCase()) || r.loc.toLowerCase().includes(search.toLowerCase());
    const mr = rack === "All" || r.rack === rack;
    return ms && mr;
  });

  const expWarn = (bb) => {
    if (!bb) return null;
    const d = new Date(bb), now = new Date();
    if (d < now) return "expired";
    if ((d - now) < 90 * 86400000) return "soon";
    return null;
  };

  return (
    <div>
      <div style={{ fontWeight: 800, fontSize: 22, marginBottom: 16 }}>📦 STOCK VIEW</div>
      <div style={{ display: "flex", gap: 10, marginBottom: 16, flexWrap: "wrap" }}>
        <input className="inp" style={{ maxWidth: 280 }} placeholder="Search product, code, location…" value={search} onChange={e => setSearch(e.target.value)} />
        <select className="sel" style={{ width: 120 }} value={rack} onChange={e => setRack(e.target.value)}>
          {racks.map(r => <option key={r}>{r}</option>)}
        </select>
        <div style={{ marginLeft: "auto", fontSize: 14, color: G.muted, alignSelf: "center" }}>{filtered.length} entries</div>
      </div>
      <div style={{ background: G.surface, borderRadius: 8, overflow: "hidden", boxShadow: "0 1px 4px rgba(0,0,0,.07)" }}>
        <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 14 }}>
          <thead>
            <tr style={{ background: G.dark, color: "#fff" }}>
              {["LOCATION","PRODUCT CODE","DESCRIPTION","BEST BEFORE","QTY","STORED"].map(h => (
                <th key={h} style={{ padding: "11px 14px", textAlign: "left", fontSize: 11, fontWeight: 700, letterSpacing: 1 }}>{h}</th>
              ))}
            </tr>
          </thead>
          <tbody>
            {filtered.map((r, i) => {
              const w = expWarn(r.bestBefore);
              return (
                <tr key={i} style={{ borderBottom: `1px solid ${G.border}`, background: i % 2 === 0 ? "#fff" : "#fafaf8" }}>
                  <td style={{ padding: "11px 14px", fontWeight: 800, color: r.isFloor ? "#4a9b18" : G.amber, fontFamily: "monospace" }}>{r.loc}</td>
                  <td style={{ padding: "11px 14px", fontFamily: "monospace", fontWeight: 700 }}>{r.productCode}</td>
                  <td style={{ padding: "11px 14px" }}>{r.description}</td>
                  <td style={{ padding: "11px 14px" }}>
                    <span style={{ color: w === "expired" ? G.red : w === "soon" ? G.yellow : G.dark, fontWeight: w ? 700 : 400 }}>
                      {r.bestBefore || "—"}{w === "expired" ? " ⚠" : w === "soon" ? " ⏰" : ""}
                    </span>
                  </td>
                  <td style={{ padding: "11px 14px", fontWeight: 800, fontSize: 16 }}>{r.qty}</td>
                  <td style={{ padding: "11px 14px", color: G.muted, fontSize: 12 }}>{r.storedAt ? new Date(r.storedAt).toLocaleDateString() : "—"}</td>
                </tr>
              );
            })}
            {filtered.length === 0 && <tr><td colSpan={6} style={{ padding: 32, textAlign: "center", color: G.muted }}>No stock entries found</td></tr>}
          </tbody>
        </table>
      </div>
    </div>
  );
}

/* ── Admin: Locations ───────────────────────────────────────────────────── */
/* ── Admin: Orders — SAP backorder import + order status ────────────────
   The .xlsx is read here in the browser. SheetJS reads every row in the
   sheet, including rows your Excel filter is hiding, so the site filter
   below is what actually keeps other sites out — not the filter in Excel.
──────────────────────────────────────────────────────────────────────── */
function AdminOrders({ products, addLog, session, showToast }) {
  const [settings, setSettings]   = useState(getOrderSettings);
  const [preview, setPreview]     = useState(null);
  const [reading, setReading]     = useState(false);
  const [importing, setImporting] = useState(false);
  const [closeMissing, setCloseMissing] = useState(true);
  const [orders, setOrders]       = useState(null);
  const [loadingOrders, setLoadingOrders] = useState(false);
  const [filter, setFilter]       = useState("open");
  const [expanded, setExpanded]   = useState(null);   // invoiceNo whose lines are open
  const [expLines, setExpLines]   = useState(null);
  const fileRef = useRef(null);

  const toggleExpand = async (invoiceNo) => {
    if (expanded === invoiceNo) { setExpanded(null); setExpLines(null); return; }
    setExpanded(invoiceNo); setExpLines(null);
    try {
      const r = await GS.getOrder(invoiceNo);
      setExpLines(r && r.ok ? (r.lines || []) : []);
    } catch (e) { setExpLines([]); showToast("Couldn't load lines: " + e.message, "err"); }
  };

  const releaseHold = async (invoiceNo, lineKey) => {
    try {
      const r = await GS.setBlock({ invoiceNo, lineKey, blocked: false, reason: "", user: session.username, role: session.role });
      if (!r || !r.ok) throw new Error(r?.error || "Failed");
      setExpLines(ls => (ls || []).map(l => l.lineKey === lineKey ? { ...l, blocked: false, blockReason: "" } : l));
      addLog("ORDER_RELEASE", `${invoiceNo} | ${lineKey} released`, session.username);
      showToast("✓ Hold released");
    } catch (e) { showToast("Couldn't release: " + e.message, "err"); }
  };

  const [revKey, setRevKey]   = useState(null);   // lineKey being reversed
  const [revGrp, setRevGrp]   = useState(0);
  const [revAmt, setRevAmt]   = useState("");

  const adminReverse = async (invoiceNo, line) => {
    const g = (line.picks || [])[revGrp];
    if (!g) { showToast("Nothing reversible on this line", "err"); return; }
    const n = parseFloat(revAmt);
    if (!n || n <= 0 || n > g.qty) { showToast(`Enter 1–${fmtQty(g.qty)}`, "err"); return; }
    try {
      const r = await GS.unpickLine({ invoiceNo, lineKey: line.lineKey, partNo: line.partNo, description: line.description, source: g.source, bb: g.bb, qty: n, user: session.username });
      if (!r || !r.ok) throw new Error(r?.error || "Failed");
      setExpLines(ls => (ls || []).map(l => l.lineKey === line.lineKey
        ? { ...l, pickedQty: r.pickedQty !== undefined ? r.pickedQty : l.pickedQty - n,
            picks: (l.picks || []).map((p, i) => i === revGrp ? { ...p, qty: p.qty - n } : p).filter(p => p.qty > 0.0001) }
        : l));
      addLog("ORDER_UNPICK", `${invoiceNo} | ${line.partNo} | ${fmtQty(n)} back to ${g.source}`, session.username);
      showToast(`✓ ${fmtQty(n)} reversed to ${g.source.replace("FLOOR:", "")}`);
      setRevKey(null); setRevAmt("");
      loadOrders();
    } catch (e) { showToast("Couldn't reverse: " + e.message, "err"); }
  };

  const placeHold = async (invoiceNo, line) => {
    const reason = window.prompt(`Hold ${line.partNo} — reason:`, "");
    if (reason === null) return;                       // cancelled
    if (!reason.trim()) { showToast("A reason is needed so pickers know why", "err"); return; }
    try {
      const r = await GS.setBlock({ invoiceNo, lineKey: line.lineKey, blocked: true, reason: reason.trim(), user: session.username, role: session.role });
      if (!r || !r.ok) throw new Error(r?.error || "Failed");
      setExpLines(ls => (ls || []).map(l => l.lineKey === line.lineKey ? { ...l, blocked: true, blockReason: reason.trim() } : l));
      addLog("ORDER_HOLD", `${invoiceNo} | ${line.partNo} | ${reason.trim()}`, session.username);
      showToast(`✓ ${line.partNo} on hold`);
    } catch (e) { showToast("Couldn't hold: " + e.message, "err"); }
  };

  // showToast is rebuilt on every AdminApp render, so it's held in a ref —
  // putting it in the dependency list below would loop the effect forever.
  const toastRef = useRef(showToast);
  useEffect(() => { toastRef.current = showToast; });

  const loadOrders = useCallback(async () => {
    if (!GS.configured()) return;
    setLoadingOrders(true);
    try {
      const r = await GS.listOrders();
      setOrders(r && r.ok ? (r.orders || []) : []);
    } catch (e) { console.error(e); toastRef.current("Couldn't load orders — check the Apps Script URL", "err"); }
    finally { setLoadingOrders(false); }
  }, []);

  useEffect(() => { loadOrders(); }, [loadOrders]);

  const productCodes = React.useMemo(() => {
    const s = new Set();
    (products || []).forEach(p => { if (p && p.code) s.add(String(p.code).trim().toUpperCase()); });
    return s;
  }, [products]);

  /* ── Read the file and build a preview. Nothing is saved until confirm. ── */
  const readFile = async (file) => {
    if (!file) return;
    setReading(true); setPreview(null);
    try {
      const buf  = await file.arrayBuffer();
      const wb   = XLSX.read(buf, { cellDates: true });
      const ws   = wb.Sheets[wb.SheetNames[0]];
      const grid = XLSX.utils.sheet_to_json(ws, { header: 1, blankrows: false, defval: "" });

      const found = mapSapColumns(grid, settings.headerSearchRows);
      if (!found) {
        setPreview({ error: `No header row found in the first ${settings.headerSearchRows} rows. The import needs a row containing both InvoiceNo and SO_History.SO_Lines.PartNo.` });
        return;
      }
      const { headerRow, map, headers } = found;
      const missing = ["invoiceNo","partNo","reqQty","site"].filter(f => map[f] === undefined);
      if (missing.length) {
        setPreview({ error: `Header row found (row ${headerRow + 1}) but these columns are missing: ${missing.join(", ")}. Check the export includes Qty on Backorder and IN_Logical.Description.` });
        return;
      }

      const body = grid.slice(headerRow + 1);
      const cell = (row, f) => (map[f] === undefined ? "" : row[map[f]]);

      let totalRows = 0, wrongSite = 0, noInvoice = 0, zeroQty = 0;
      const seq = {};                       // occurrence count per invoice+part
      const lines = [];
      const sitesSeen = new Set();

      body.forEach(row => {
        if (!row || row.every(c => c === "" || c === null)) return;
        totalRows++;
        const invoiceNo = String(cell(row, "invoiceNo") || "").trim();
        if (!invoiceNo) { noInvoice++; return; }
        const site = String(cell(row, "site") || "").trim();
        if (site) sitesSeen.add(site);
        if (normHeader(site) !== normHeader(settings.site)) { wrongSite++; return; }

        const partNo = String(cell(row, "partNo") || "").trim().toUpperCase();
        const reqQty = toNum(cell(row, "reqQty"));
        if (!partNo) return;
        if (reqQty <= 0) { zeroQty++; return; }

        const k = invoiceNo + "|" + partNo;
        seq[k] = (seq[k] || 0) + 1;

        lines.push({
          lineKey:     `${invoiceNo}|${partNo}|${seq[k]}`,
          invoiceNo,
          invoiceDate: normDate(cell(row, "invoiceDate")),
          customerPO:  String(cell(row, "customerPO") || "").trim(),
          dueDate:     normDate(cell(row, "dueDate")),
          customer:    String(cell(row, "customer") || "").trim(),
          site,
          partNo,
          description: String(cell(row, "description") || "").trim(),
          reqQty,
        });
      });

      const unmatched = [...new Set(lines.filter(l => !productCodes.has(l.partNo)).map(l => l.partNo))];
      const invoices  = [...new Set(lines.map(l => l.invoiceNo))];

      setPreview({
        headerRow, headers, map, lines, unmatched, invoices,
        totalRows, wrongSite, noInvoice, zeroQty,
        sitesSeen: [...sitesSeen],
        fileName: file.name,
      });
    } catch (e) {
      console.error(e);
      setPreview({ error: "Couldn't read that file: " + e.message });
    } finally { setReading(false); }
  };

  const doImport = async () => {
    if (!preview || !preview.lines?.length) return;
    setImporting(true);
    try {
      const r = await GS.importOrders(preview.lines, closeMissing);
      if (!r || !r.ok) throw new Error(r?.error || "Import failed");
      addLog("ORDERS_IMPORT",
        `${preview.fileName} | Lines:${preview.lines.length} | New:${r.added} Updated:${r.updated} Closed:${r.closed} QtyReset:${r.reset}`,
        session.username);
      showToast(`✓ ${r.added} new · ${r.updated} updated · ${r.closed} closed`);
      setPreview(null);
      if (fileRef.current) fileRef.current.value = "";
      loadOrders();
    } catch (e) {
      console.error(e);
      showToast("Import failed: " + e.message, "err");
    } finally { setImporting(false); }
  };

  const releaseLock = async (invoiceNo) => {
    try {
      await GS.releaseOrder(invoiceNo, session.username);
      addLog("ORDER_UNLOCK", `Admin released ${invoiceNo}`, session.username);
      showToast(`✓ ${invoiceNo} unlocked`);
      loadOrders();
    } catch (e) { showToast("Couldn't unlock: " + e.message, "err"); }
  };

  const shown = (orders || []).filter(o =>
    filter === "all" ? true : filter === "open" ? o.status !== "Closed" : o.status === "Closed"
  );

  const box = { background: G.surface, border: `1px solid ${G.border}`, borderRadius: 8, padding: 18, marginBottom: 18 };

  return (
    <div>
      {/* ── Import ── */}
      <div style={box}>
        <div style={{ fontWeight: 800, fontSize: 19, marginBottom: 4 }}>📤 Upload orders</div>
        <div style={{ color: G.muted, fontSize: 14, marginBottom: 16 }}>
          Select the SAP backorder export. Nothing is saved until you review the summary.
        </div>

        <div style={{ display: "flex", gap: 12, alignItems: "flex-end", flexWrap: "wrap", marginBottom: 14 }}>
          <div style={{ flex: "1 1 200px" }}>
            <label className="lbl">Site to import (column L)</label>
            <input className="inp" value={settings.site}
              onChange={e => { const s = { ...settings, site: e.target.value }; setSettings(s); setOrderSettings(s); }} />
          </div>
          <button className="btn-amber" onClick={() => fileRef.current?.click()} disabled={reading}>
            {reading ? "READING…" : "CHOOSE FILE"}
          </button>
        </div>
        <input ref={fileRef} type="file" accept=".xlsx,.xls,.xlsm" style={{ display: "none" }}
          onChange={e => readFile(e.target.files?.[0])} />

        {preview?.error && <ErrBox msg={preview.error} />}

        {preview && !preview.error && (
          <div style={{ marginTop: 6, animation: "fadeUp .2s ease" }}>
            <div style={{ background: G.blueLight, border: `1px solid #bfdbfe`, borderRadius: 8, padding: 16 }}>
              <div style={{ fontWeight: 800, fontSize: 16, marginBottom: 10 }}>{preview.fileName}</div>
              <div style={{ fontSize: 14, color: "#333", lineHeight: 1.9 }}>
                Header row found at row <b>{preview.headerRow + 1}</b><br/>
                <b>{preview.totalRows}</b> rows read from the sheet<br/>
                <b>{preview.wrongSite}</b> skipped — different site{preview.sitesSeen.length > 1 && <span style={{ color: G.muted }}> (found: {preview.sitesSeen.join(", ")})</span>}<br/>
                {preview.zeroQty > 0 && <span><b>{preview.zeroQty}</b> skipped — nothing on backorder<br/></span>}
                <b style={{ color: G.green, fontSize: 17 }}>{preview.lines.length}</b> lines across <b>{preview.invoices.length}</b> orders will import
              </div>
            </div>

            {preview.unmatched.length > 0 && (
              <div style={{ background: G.redLight, border: "1px solid #fca5a5", borderRadius: 8, padding: 16, marginTop: 12 }}>
                <div style={{ fontWeight: 800, color: G.red, marginBottom: 6 }}>
                  ⚠ {preview.unmatched.length} product code{preview.unmatched.length > 1 ? "s" : ""} not in your Products tab
                </div>
                <div style={{ fontSize: 13, color: "#7f1d1d", marginBottom: 8 }}>
                  These lines will import, but pickers won't find stock against them until the codes exist in Products.
                </div>
                <div style={{ fontFamily: "monospace", fontSize: 13, color: "#7f1d1d", maxHeight: 120, overflowY: "auto" }}>
                  {preview.unmatched.join(", ")}
                </div>
              </div>
            )}

            <label style={{ display: "flex", alignItems: "flex-start", gap: 10, marginTop: 14, cursor: "pointer" }}>
              <input type="checkbox" checked={closeMissing} onChange={e => setCloseMissing(e.target.checked)}
                style={{ width: 18, height: 18, marginTop: 2, accentColor: G.amber, flexShrink: 0 }} />
              <span style={{ fontSize: 14, color: "#333" }}>
                <b>Close lines that are no longer in this file.</b> Shipped lines drop off the SAP export, so this
                clears them from the pickers' list. Untick if this export is filtered to only part of your orders.
              </span>
            </label>

            <div style={{ display: "flex", gap: 10, marginTop: 16 }}>
              <button className="btn-amber" style={{ minWidth: 160 }} onClick={doImport} disabled={importing}>
                {importing ? "IMPORTING…" : `IMPORT ${preview.lines.length} LINES`}
              </button>
              <button className="btn-ghost-sm" onClick={() => { setPreview(null); if (fileRef.current) fileRef.current.value = ""; }}>CANCEL</button>
            </div>
          </div>
        )}
      </div>

      {/* ── PO import for Inbound ── */}
      <div style={box}>
        <div style={{ fontWeight: 800, fontSize: 19, marginBottom: 4 }}>📥 Upload purchase orders (Inbound)</div>
        <div style={{ color: G.muted, fontSize: 14, marginBottom: 12 }}>
          Upload the SAP PO export so Inbound can auto-fill supplier, product and quantity. Column names are guessed and shown before anything saves.
        </div>
        <POImport showToast={showToast} addLog={addLog} session={session} />
      </div>

      {/* ── Order list ── */}
      <div style={box}>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 14, flexWrap: "wrap", gap: 10 }}>
          <div style={{ fontWeight: 800, fontSize: 19 }}>📋 Orders</div>
          <div style={{ display: "flex", gap: 8 }}>
            {[["open","OPEN"],["closed","CLOSED"],["all","ALL"]].map(([id, label]) => (
              <button key={id} onClick={() => setFilter(id)}
                className={filter === id ? "btn-amber-sm" : "btn-ghost-sm"}>{label}</button>
            ))}
            <button className="btn-ghost-sm" onClick={loadOrders}>↻ REFRESH</button>
          </div>
        </div>

        {loadingOrders && <div style={{ color: G.muted, fontSize: 14 }}>Loading…</div>}
        {!loadingOrders && orders && orders.length === 0 && (
          <div style={{ color: G.muted, fontSize: 14 }}>No orders yet. Upload a SAP export to get started.</div>
        )}

        {!loadingOrders && shown.length > 0 && (
          <div style={{ overflowX: "auto" }}>
            <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 14 }}>
              <thead>
                <tr style={{ borderBottom: `2px solid ${G.border}`, textAlign: "left" }}>
                  {["INVOICE","CUSTOMER","DUE","LINES","PICKED","STATUS",""].map(h => (
                    <th key={h} style={{ padding: "8px 10px", fontSize: 11, letterSpacing: 1, color: G.muted }}>{h}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {shown.map(o => {
                  const done = o.linesDone >= o.lineCount && o.lineCount > 0;
                  const col  = o.status === "Closed" ? G.muted : done ? G.green : o.linesDone > 0 ? G.yellow : G.dark;
                  const isOpen = expanded === o.invoiceNo;
                  return (
                    <React.Fragment key={o.invoiceNo}>
                    <tr style={{ borderBottom: `1px solid ${G.border}`, background: isOpen ? G.amberLight : "transparent" }}>
                      <td style={{ padding: "10px", fontWeight: 800, fontFamily: "monospace" }}>
                        <button onClick={() => toggleExpand(o.invoiceNo)}
                          style={{ background: "none", border: "none", cursor: "pointer", font: "inherit", color: G.dark, padding: 0, display: "flex", alignItems: "center", gap: 6 }}>
                          <span style={{ color: G.amber, transform: isOpen ? "rotate(90deg)" : "none", transition: "transform .15s", display: "inline-block" }}>›</span>
                          {o.invoiceNo}
                        </button>
                      </td>
                      <td style={{ padding: "10px" }}>{o.customer}</td>
                      <td style={{ padding: "10px", whiteSpace: "nowrap" }}>{o.dueDate || "—"}</td>
                      <td style={{ padding: "10px" }}>{o.lineCount}</td>
                      <td style={{ padding: "10px", color: col, fontWeight: 700 }}>{o.linesDone}/{o.lineCount}</td>
                      <td style={{ padding: "10px", color: col, fontWeight: 700 }}>
                        {o.status === "Closed" ? "CLOSED" : done ? "COMPLETE" : o.linesDone > 0 ? "PART-PICKED" : "OPEN"}
                        {o.holds > 0 && <div style={{ fontSize: 12, color: "#7a5cff", fontWeight: 700 }}>⏸ {o.holds} on hold</div>}
                        {o.lockedBy && <div style={{ fontSize: 12, color: G.red, fontWeight: 700 }}>🔒 {o.lockedBy}</div>}
                      </td>
                      <td style={{ padding: "10px", textAlign: "right" }}>
                        {o.lockedBy && <button className="btn-red-sm" onClick={() => releaseLock(o.invoiceNo)}>UNLOCK</button>}
                      </td>
                    </tr>
                    {isOpen && (
                      <tr>
                        <td colSpan={7} style={{ padding: "0 10px 14px", background: G.amberLight }}>
                          {!expLines && <div style={{ color: G.muted, fontSize: 13, padding: "10px 0" }}>Loading lines…</div>}
                          {expLines && expLines.length === 0 && <div style={{ color: G.muted, fontSize: 13, padding: "10px 0" }}>No lines.</div>}
                          {expLines && expLines.map(l => (
                            <React.Fragment key={l.lineKey}>
                            <div style={{ display: "flex", alignItems: "center", gap: 12, padding: "8px 10px", borderBottom: `1px solid ${G.border}`, flexWrap: "wrap" }}>
                              <span style={{ fontFamily: "monospace", fontWeight: 700, minWidth: 90 }}>{l.partNo}</span>
                              <span style={{ flex: 1, minWidth: 160 }}>{l.description}</span>
                              <span style={{ fontWeight: 800, color: l.pickedQty >= l.reqQty ? G.green : l.pickedQty > 0 ? G.yellow : G.dark }}>
                                {fmtQty(l.pickedQty)}/{fmtQty(l.reqQty)}
                              </span>
                              {l.blocked
                                ? <span style={{ display: "flex", alignItems: "center", gap: 8 }}>
                                    <span style={{ color: "#6d4ae0", fontWeight: 700, fontSize: 13 }}>⏸ {l.blockReason}</span>
                                    <button className="btn-green-sm" onClick={() => releaseHold(o.invoiceNo, l.lineKey)}>RELEASE</button>
                                  </span>
                                : <span style={{ display: "flex", gap: 6 }}>
                                    {l.pickedQty > 0 && (l.picks || []).length > 0 &&
                                      <button className="btn-ghost-sm" onClick={() => { setRevKey(revKey === l.lineKey ? null : l.lineKey); setRevGrp(0); setRevAmt(""); }}>↩ REVERSE</button>}
                                    <button className="btn-red-sm" onClick={() => placeHold(o.invoiceNo, l)}>⏸ HOLD</button>
                                  </span>}
                            </div>
                            {revKey === l.lineKey && (
                              <div style={{ display: "flex", alignItems: "center", gap: 10, padding: "10px 10px 12px 28px", flexWrap: "wrap", background: "#fdfaf2", borderBottom: `1px solid ${G.border}` }}>
                                <select className="sel" value={revGrp} onChange={e => setRevGrp(Number(e.target.value))} style={{ minHeight: 38, padding: "6px 10px" }}>
                                  {(l.picks || []).map((g, i) => (
                                    <option key={i} value={i}>{g.source.replace("FLOOR:", "") + (g.source.indexOf("FLOOR:") === 0 ? " (floor)" : "")} · BB {g.bb || "—"} · {fmtQty(g.qty)} reversible</option>
                                  ))}
                                </select>
                                <input className="inp" type="number" min="0" step="any" placeholder="Qty" value={revAmt}
                                  onChange={e => setRevAmt(e.target.value)} style={{ width: 90, minHeight: 38, padding: "6px 10px" }} />
                                <button className="btn-amber-sm" onClick={() => adminReverse(o.invoiceNo, l)}>REVERSE</button>
                                <span style={{ fontSize: 12, color: G.muted }}>Stock goes back to that location — put the cartons back.</span>
                              </div>
                            )}
                          </React.Fragment>))}
                        </td>
                      </tr>
                    )}
                    </React.Fragment>
                  );
                })}
              </tbody>
            </table>
          </div>
        )}
      </div>
    </div>
  );
}

function POImport({ showToast, addLog, session }) {
  const [grid, setGrid]   = useState(null);
  const [headers, setHeaders] = useState([]);
  const [headerRow, setHeaderRow] = useState(0);
  const [map, setMap]     = useState({});
  const [importing, setImporting] = useState(false);
  const fRef = useRef(null);

  const FIELDS = [
    ["po",       "PO number",    ["PONumber","PO Number","PO No","PO","DocNum","OrderNo","Purchase Order"]],
    ["supplier", "Supplier",     ["Supplier","Supplier Name","Vendor","CardName","Vendor Name"]],
    ["code",     "Product code", ["ItemCode","Product Code","PartNo","Item No","Code","SKU"]],
    ["name",     "Product name", ["Description","Dscription","ItemName","Product Name","Item Description"]],
    ["qty",      "Quantity",     ["Qty","Quantity","OrderQty","Open Qty","Ordered Qty"]],
  ];

  const readFile = async (file) => {
    if (!file) return;
    try {
      const buf = await file.arrayBuffer();
      const wb  = XLSX.read(buf, { cellDates: true });
      const g   = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, blankrows: false, defval: "" });
      // find the densest early row as header
      let hr = 0, best = 0;
      for (let r = 0; r < Math.min(15, g.length); r++) {
        const filled = (g[r] || []).filter(c => c !== "").length;
        if (filled > best) { best = filled; hr = r; }
      }
      const hs = (g[hr] || []).map(h => String(h));
      const m = {};
      FIELDS.forEach(([f, , names]) => {
        for (const n of names) {
          const i = hs.findIndex(h => normHeader(h) === normHeader(n));
          if (i !== -1) { m[f] = i; return; }
        }
        m[f] = -1;
      });
      setGrid(g); setHeaders(hs); setHeaderRow(hr); setMap(m);
    } catch (e) { showToast("Couldn't read that file: " + e.message, "err"); }
  };

  const doImport = async () => {
    const missing = FIELDS.filter(([f]) => map[f] === undefined || map[f] < 0);
    if (missing.length) { showToast("Choose a column for: " + missing.map(x => x[1]).join(", "), "err"); return; }
    const rows = [];
    grid.slice(headerRow + 1).forEach(r => {
      if (!r || r.every(c => c === "")) return;
      const po = String(r[map.po] ?? "").trim();
      const code = String(r[map.code] ?? "").trim();
      if (!po || !code) return;
      rows.push({ po, supplier: String(r[map.supplier] ?? "").trim(), code,
                  name: String(r[map.name] ?? "").trim(), qty: toNum(r[map.qty]) });
    });
    if (!rows.length) { showToast("No usable rows found", "err"); return; }
    setImporting(true);
    try {
      const res = await GS.importPOs(rows);
      if (!res || !res.ok) throw new Error(res?.error || "Import failed");
      addLog("PO_IMPORT", `${res.pos} POs · ${res.lines} lines`, session.username);
      showToast(`✓ ${res.pos} POs · ${res.lines} lines imported`);
      setGrid(null); if (fRef.current) fRef.current.value = "";
    } catch (e) { showToast("Import failed: " + e.message, "err"); }
    finally { setImporting(false); }
  };

  return (
    <div>
      <button className="btn-amber" onClick={() => fRef.current?.click()}>CHOOSE PO FILE</button>
      <input ref={fRef} type="file" accept=".xlsx,.xls,.xlsm,.csv" style={{ display: "none" }} onChange={e => readFile(e.target.files?.[0])} />
      {grid && (
        <div style={{ marginTop: 14, animation: "fadeUp .2s ease" }}>
          <div style={{ fontSize: 13, color: G.muted, marginBottom: 10 }}>
            Header row {headerRow + 1} · check each field points at the right column:
          </div>
          <div style={{ display: "grid", gap: 8, maxWidth: 480 }}>
            {FIELDS.map(([f, label]) => (
              <div key={f} style={{ display: "flex", alignItems: "center", gap: 10 }}>
                <span style={{ width: 110, fontSize: 13, fontWeight: 700 }}>{label}</span>
                <select className="sel" value={map[f] ?? -1} onChange={e => setMap(m => ({ ...m, [f]: Number(e.target.value) }))} style={{ flex: 1, minHeight: 36, padding: "4px 8px" }}>
                  <option value={-1}>— choose column —</option>
                  {headers.map((h, i) => <option key={i} value={i}>{h || `(column ${i + 1})`}</option>)}
                </select>
              </div>
            ))}
          </div>
          <div style={{ display: "flex", gap: 10, marginTop: 12 }}>
            <button className="btn-amber" onClick={doImport} disabled={importing}>{importing ? "IMPORTING…" : "IMPORT POs"}</button>
            <button className="btn-ghost-sm" onClick={() => { setGrid(null); if (fRef.current) fRef.current.value = ""; }}>CANCEL</button>
          </div>
        </div>
      )}
    </div>
  );
}

function AdminLocations({ locations, setLocations, products, addLog, session, showToast, skipNextSync }) {
  const [rack, setRack] = useState("All");
  const [editLoc, setEditLoc] = useState(null);
  const [editingName, setEditingName] = useState(null);
  const [editingAllowed, setEditingAllowed] = useState(null);
  const [addingLoc, setAddingLoc] = useState(false);
  const [newLocForm, setNewLocForm] = useState({ id: "", rack: "", maxProducts: 2 });
  const racks = ["All", ...new Set(Object.values(locations).map(l => l.rack))];
  const filtered = Object.values(locations).filter(l => rack === "All" || l.rack === rack).sort((a,b) => a.id.localeCompare(b.id));

  /* Every change writes only its own row to Sheets. Settings edits keep
     the bin's live stock untouched (preserveContents), so an admin screen
     that's been open for hours can't overwrite what pickers did since. */
  const pushLoc = async (loc, preserveContents, onOk) => {
    if (GS.configured()) {
      try {
        const r = await GS.locWrite(loc, preserveContents);
        if (!r || !r.ok) { showToast("Not saved — " + (r?.error || "server error"), "err"); return; }
      } catch (e) { showToast("Not saved — " + e.message, "err"); return; }
    }
    if (skipNextSync) skipNextSync();
    onOk();
  };

  const removeContent = (locId, idx) => {
    const loc = locations[locId];
    const contents = loc.contents.filter((_,i) => i !== idx);
    pushLoc({ ...loc, contents }, false, () => {
      setLocations(prev => ({ ...prev, [locId]: { ...prev[locId], contents } }));
      addLog("ADMIN_REMOVE", `Removed item from ${locId}`, session.username);
      showToast("Item removed");
    });
  };
  const editContent = (locId, idx, field, val) => {
    if (skipNextSync) skipNextSync();   // local while typing; SAVE commits
    setLocations(prev => ({ ...prev, [locId]: { ...prev[locId], contents: prev[locId].contents.map((c,i) => i===idx?{...c,[field]:val}:c) } }));
  };
  const commitContent = (locId) => {
    const loc = locations[locId];
    pushLoc(loc, false, () => {
      showToast("Saved");
      addLog("ADMIN_EDIT", `Edited contents at ${locId}`, session.username);
    });
  };
  const removeLocation = (locId) => {
    if (!window.confirm(`Delete location ${locId}? This cannot be undone.`)) return;
    (async () => {
      if (GS.configured()) {
        try {
          const r = await GS.locDelete(locId);
          if (!r || !r.ok) { showToast("Not deleted — " + (r?.error || "server error"), "err"); return; }
        } catch (e) { showToast("Not deleted — " + e.message, "err"); return; }
      }
      if (skipNextSync) skipNextSync();
      setLocations(prev => { const n={...prev}; delete n[locId]; return n; });
      showToast(`Location ${locId} deleted`);
      addLog("ADMIN_DEL_LOC", `Deleted location ${locId}`, session.username);
    })();
  };
  const saveName = (locId, name) => {
    pushLoc({ ...locations[locId], customName: name }, true, () => {
      setLocations(prev => ({ ...prev, [locId]: { ...prev[locId], customName: name } }));
      setEditingName(null); showToast("Name saved");
    });
  };
  const saveAllowed = (locId, allowed) => {
    pushLoc({ ...locations[locId], allowedProducts: allowed }, true, () => {
      setLocations(prev => ({ ...prev, [locId]: { ...prev[locId], allowedProducts: allowed } }));
      setEditingAllowed(null); showToast("Allowed products saved");
    });
  };
  const addLocation = () => {
    const id = newLocForm.id.trim().toUpperCase();
    if (!id) { showToast("Enter location ID", "err"); return; }
    if (locations[id]) { showToast("Location already exists", "err"); return; }
    const loc = { id, rack: newLocForm.rack || id[0], row: 0, slot: "", maxProducts: parseInt(newLocForm.maxProducts)||2, contents: [], allowedProducts: [], customName: "" };
    pushLoc(loc, false, () => {
      setLocations(prev => ({ ...prev, [id]: loc }));
      setAddingLoc(false); setNewLocForm({ id:"", rack:"", maxProducts:2 });
      showToast(`Location ${id} added`);
      addLog("ADMIN_ADD_LOC", `Added location ${id}`, session.username);
    });
  };

  return (
    <div>
      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:16 }}>
        <div style={{ fontWeight:800, fontSize:22 }}>🗂 LOCATIONS</div>
        <button className="btn-amber" onClick={() => setAddingLoc(a=>!a)}>+ ADD LOCATION</button>
      </div>

      {addingLoc && (
        <div style={{ background:G.amberLight, border:`1px solid ${G.amber}`, borderRadius:8, padding:18, marginBottom:16 }}>
          <div style={{ fontWeight:700, fontSize:15, marginBottom:12 }}>New Location</div>
          <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr 120px", gap:12 }}>
            <div><label className="lbl">LOCATION ID *</label><input className="inp" value={newLocForm.id} onChange={e=>setNewLocForm(f=>({...f,id:e.target.value.toUpperCase()}))} placeholder="J06A"/></div>
            <div><label className="lbl">RACK</label><input className="inp" value={newLocForm.rack} onChange={e=>setNewLocForm(f=>({...f,rack:e.target.value.toUpperCase()}))} placeholder="J"/></div>
            <div><label className="lbl">MAX PRODUCTS</label>
              <select className="sel" value={newLocForm.maxProducts} onChange={e=>setNewLocForm(f=>({...f,maxProducts:e.target.value}))}>
                {[1,2,3,4,5].map(n=><option key={n}>{n}</option>)}
              </select>
            </div>
          </div>
          <div style={{ display:"flex", gap:10, marginTop:14 }}>
            <button className="btn-amber" onClick={addLocation}>ADD</button>
            <button className="btn-ghost-sm" onClick={()=>setAddingLoc(false)}>CANCEL</button>
          </div>
        </div>
      )}

      <div style={{ display:"flex", gap:8, marginBottom:16, flexWrap:"wrap" }}>
        {racks.map(r => (
          <button key={r} onClick={()=>setRack(r)} className={rack===r?"btn-amber-sm":"btn-ghost-sm"}>{r==="All"?"ALL RACKS":`RACK ${r}`}</button>
        ))}
      </div>

      <div style={{ display:"grid", gap:10 }}>
        {filtered.map(loc => {
          const free = loc.maxProducts - distinctProducts(loc);
          const isEditingAllowed = editingAllowed === loc.id;
          const isEditingName = editingName === loc.id;
          return (
            <div key={loc.id} style={{ background:G.surface, borderRadius:8, border:`1px solid ${G.border}`, overflow:"hidden" }}>
              {/* Location header */}
              <div style={{ display:"flex", alignItems:"center", gap:12, padding:"12px 16px", background:"#fafaf8", borderBottom:`1px solid ${G.border}`, flexWrap:"wrap" }}>
                <div style={{ fontWeight:800, fontSize:18, color:G.amber, fontFamily:"monospace", minWidth:60 }}>{loc.id}</div>
                {/* Custom name */}
                {isEditingName ? (
                  <NameEditor locId={loc.id} current={loc.customName||""} onSave={saveName} onCancel={()=>setEditingName(null)} />
                ) : (
                  <div style={{ display:"flex", alignItems:"center", gap:6 }}>
                    <span style={{ fontSize:13, color: loc.customName ? G.dark : G.muted, fontStyle: loc.customName ? "normal":"italic" }}>{loc.customName || "No label"}</span>
                    <button className="btn-ghost-sm" style={{ padding:"2px 8px", fontSize:11 }} onClick={()=>setEditingName(loc.id)}>✏</button>
                  </div>
                )}
                <div style={{ fontSize:13, color:G.muted }}>Max: <b style={{color:G.dark}}>{loc.maxProducts}</b></div>
                <div style={{ fontSize:13 }}><span style={{ color:free>0?G.green:G.red, fontWeight:700 }}>{free} free</span></div>
                {/* Allowed products badge */}
                {loc.allowedProducts?.length > 0 && (
                  <div style={{ background:"#eff6ff", border:"1px solid #93c5fd", borderRadius:4, padding:"2px 8px", fontSize:11, color:G.blue, fontWeight:700 }}>
                    {loc.allowedProducts.length} RECOMMENDED
                  </div>
                )}
                <div style={{ display:"flex", gap:4, marginLeft:"auto" }}>
                  {Array.from({length:loc.maxProducts}).map((_,i) => (
                    <div key={i} style={{ width:18, height:18, borderRadius:4, background:i<distinctProducts(loc)?G.amber:G.border, border:`1px solid ${i<distinctProducts(loc)?G.amberDark:"#ccc"}` }}/>
                  ))}
                </div>
                <button className="btn-ghost-sm" style={{ padding:"4px 10px", fontSize:11 }} onClick={()=>setEditingAllowed(isEditingAllowed?null:loc.id)}>
                  {isEditingAllowed ? "CLOSE" : "SET PRODUCTS"}
                </button>
                <button className="btn-red-sm" style={{ padding:"4px 10px", fontSize:11 }} onClick={()=>removeLocation(loc.id)}>DEL</button>
              </div>

              {/* Allowed products editor */}
              {isEditingAllowed && (
                <AllowedProductsEditor loc={loc} products={products} onSave={saveAllowed} onCancel={()=>setEditingAllowed(null)} />
              )}

              {/* Contents */}
              {loc.contents.length === 0 && !isEditingAllowed && (
                <div style={{ padding:"12px 16px", color:G.muted, fontSize:13, fontStyle:"italic" }}>Empty location</div>
              )}
              {loc.contents.map((c, idx) => (
                <div key={idx} style={{ padding:"12px 16px", borderBottom:`1px solid ${G.border}`, display:"flex", gap:10, alignItems:"center", flexWrap:"wrap" }}>
                  <div style={{ flex:1, minWidth:200 }}>
                    <div style={{ fontWeight:700, fontSize:15 }}>{c.description}</div>
                    <div style={{ fontSize:12, color:G.muted, fontFamily:"monospace" }}>{c.productCode}</div>
                  </div>
                  {editLoc === `${loc.id}-${idx}` ? (
                    <div style={{ display:"flex", gap:8, alignItems:"center", flexWrap:"wrap" }}>
                      <div><label className="lbl">BEST BEFORE</label><DatePicker value={c.bestBefore} onChange={v=>editContent(loc.id,idx,"bestBefore",v)} /></div>
                      <div><label className="lbl">QTY</label><input className="inp" type="number" value={c.qty} onChange={e=>editContent(loc.id,idx,"qty",parseInt(e.target.value)||0)} style={{ width:90, minHeight:38, padding:"6px 10px" }}/></div>
                      <button className="btn-green-sm" style={{ marginTop:18 }} onClick={()=>{ setEditLoc(null); commitContent(loc.id); }}>SAVE</button>
                    </div>
                  ) : (
                    <>
                      <div style={{ textAlign:"center", minWidth:90 }}>
                        <div style={{ fontSize:11, color:G.muted, letterSpacing:1 }}>BEST BEFORE</div>
                        <div style={{ fontWeight:700, color:c.bestBefore&&new Date(c.bestBefore)<new Date()?G.red:G.dark }}>{c.bestBefore||"—"}</div>
                      </div>
                      <div style={{ textAlign:"center", minWidth:60 }}>
                        <div style={{ fontSize:11, color:G.muted, letterSpacing:1 }}>QTY</div>
                        <div style={{ fontWeight:800, fontSize:20 }}>{c.qty}</div>
                      </div>
                      <button className="btn-ghost-sm" onClick={()=>setEditLoc(`${loc.id}-${idx}`)}>EDIT</button>
                      <button className="btn-red-sm" onClick={()=>{ if(window.confirm(`Remove ${c.description} from ${loc.id}?`)) removeContent(loc.id,idx); }}>REMOVE</button>
                    </>
                  )}
                </div>
              ))}
            </div>
          );
        })}
      </div>
    </div>
  );
}

/* Inline name editor */
function NameEditor({ locId, current, onSave, onCancel }) {
  const [val, setVal] = useState(current);
  return (
    <div style={{ display:"flex", gap:6, alignItems:"center" }}>
      <input className="inp" value={val} onChange={e=>setVal(e.target.value)} placeholder="e.g. Beverages Row" style={{ minHeight:34, padding:"4px 10px", fontSize:13, width:180 }}/>
      <button className="btn-green-sm" style={{ padding:"4px 10px" }} onClick={()=>onSave(locId, val)}>SAVE</button>
      <button className="btn-ghost-sm" style={{ padding:"4px 10px" }} onClick={onCancel}>✕</button>
    </div>
  );
}

/* Allowed products editor — up to 5 */
function AllowedProductsEditor({ loc, products, onSave, onCancel }) {
  const [selected, setSelected] = useState(loc.allowedProducts || []);
  const [search, setSearch] = useState("");
  const filtered = products.filter(p =>
    !search || p.description.toLowerCase().includes(search.toLowerCase()) || p.code.toLowerCase().includes(search.toLowerCase())
  );
  const toggle = (code) => {
    if (selected.includes(code)) setSelected(s => s.filter(c => c !== code));
    else if (selected.length < 5) setSelected(s => [...s, code]);
  };
  return (
    <div style={{ background:G.blueLight, borderBottom:`1px solid #bfdbfe`, padding:"14px 16px" }}>
      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:10 }}>
        <div>
          <div style={{ fontWeight:700, fontSize:14, color:G.blue }}>RECOMMENDED PRODUCTS for {loc.id}</div>
          <div style={{ fontSize:12, color:G.muted, marginTop:2 }}>Select up to 5 — picker will see a recommendation (not a block)</div>
        </div>
        <span style={{ background:G.blue, color:"#fff", borderRadius:4, padding:"2px 8px", fontSize:12, fontWeight:700 }}>{selected.length}/5</span>
      </div>
      <input className="inp" value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search products…" style={{ marginBottom:10, minHeight:36, padding:"6px 10px", fontSize:13 }}/>
      <div style={{ maxHeight:200, overflowY:"auto", display:"grid", gap:6, marginBottom:12 }}>
        {filtered.map(p => {
          const on = selected.includes(p.code);
          const disabled = !on && selected.length >= 5;
          return (
            <div key={p.code} onClick={()=>!disabled&&toggle(p.code)}
              style={{ display:"flex", alignItems:"center", gap:10, padding:"8px 12px", borderRadius:6, border:`2px solid ${on?G.blue:G.border}`, background:on?"#dbeafe":"#fff", cursor:disabled?"not-allowed":"pointer", opacity:disabled?.5:1 }}>
              <div style={{ width:18, height:18, borderRadius:4, border:`2px solid ${on?G.blue:"#ccc"}`, background:on?G.blue:"#fff", display:"flex", alignItems:"center", justifyContent:"center", flexShrink:0 }}>
                {on && <span style={{ color:"#fff", fontSize:12, fontWeight:800 }}>✓</span>}
              </div>
              <div style={{ flex:1 }}>
                <div style={{ fontWeight:600, fontSize:14 }}>{p.description}</div>
                <div style={{ fontSize:11, color:G.muted, fontFamily:"monospace" }}>{p.code} {p.barcode ? `· ${p.barcode}` : ""}</div>
              </div>
            </div>
          );
        })}
      </div>
      {selected.length > 0 && (
        <div style={{ marginBottom:10, fontSize:12, color:G.blue, fontWeight:600 }}>
          Selected: {selected.map(c => products.find(p=>p.code===c)?.description || c).join(", ")}
        </div>
      )}
      <div style={{ display:"flex", gap:8 }}>
        <button className="btn-amber" onClick={()=>onSave(loc.id, selected)}>SAVE</button>
        <button className="btn-ghost-sm" onClick={()=>onSave(loc.id, [])}>CLEAR ALL</button>
        <button className="btn-ghost-sm" onClick={onCancel}>CANCEL</button>
      </div>
    </div>
  );
}
/* ── Admin: Products ────────────────────────────────────────────────────── */
function AdminProducts({ products, setProducts, addLog, session, showToast }) {
  const [editing, setEditing] = useState(null);
  const [form, setForm] = useState({ code:"", barcode:"", description:"", category:"" });
  const [adding, setAdding] = useState(false);
  const [search, setSearch] = useState("");

  const startEdit = (p) => { setEditing(p.code); setForm({ code:p.code, barcode:p.barcode||"", description:p.description, category:p.category||"" }); setAdding(false); };
  const startAdd  = () => { setAdding(true); setEditing(null); setForm({ code:"", barcode:"", description:"", category:"" }); };
  const save = () => {
    if (!form.code.trim() || !form.description.trim()) { showToast("Code and description required","err"); return; }
    const code = form.code.trim().toUpperCase();
    if (adding) {
      if (products.find(p => p.code === code)) { showToast("Code already exists","err"); return; }
      if (products.find(p => String(p.code||"").toUpperCase() === code.toUpperCase())) { showToast("Code already exists","err"); return; }
      setProducts(prev => [...prev, { code, barcode: form.barcode||"", description: form.description, category: form.category||"" }]);
      addLog("PRODUCT_ADD", form.description, session.username);
    } else {
      setProducts(prev => prev.map(x => x.code === editing ? { code, barcode: form.barcode||"", description: form.description, category: form.category||"" } : x));
      addLog("PRODUCT_EDIT", form.description, session.username);
    }
    showToast(adding ? "Product added" : "Product updated");
    setEditing(null); setAdding(false);
  };

  const filtered = (products || []).filter(p => {
    if (!p || !p.code) return false;
    if (!search) return true;
    const q = search.toLowerCase();
    return (String(p.code)||"").toLowerCase().includes(q) ||
           (String(p.barcode||"")).toLowerCase().includes(q) ||
           (String(p.description||"")).toLowerCase().includes(q) ||
           (String(p.category||"")).toLowerCase().includes(q);
  });

  return (
    <div>
      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:16 }}>
        <div style={{ fontWeight:800, fontSize:22 }}>🏷 PRODUCTS</div>
        <button className="btn-amber" onClick={startAdd}>+ ADD PRODUCT</button>
      </div>
      <input className="inp" style={{ marginBottom:14, maxWidth:340 }} placeholder="Search by code, barcode or name…"
        value={search} onChange={e=>setSearch(e.target.value)} />
      {(adding || editing) && (
        <div style={{ background:G.amberLight, border:`1px solid ${G.amber}`, borderRadius:8, padding:18, marginBottom:16 }}>
          <div style={{ fontWeight:700, marginBottom:12, fontSize:15 }}>{adding ? "New Product" : `Editing ${editing}`}</div>
          <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:12 }}>
            <div><label className="lbl">PRODUCT CODE *</label><input className="inp" value={form.code} onChange={e=>setForm(f=>({...f,code:e.target.value.toUpperCase()}))} placeholder="P006"/></div>
            <div><label className="lbl">BARCODE (SCANNER)</label><input className="inp" value={form.barcode} onChange={e=>setForm(f=>({...f,barcode:e.target.value}))} placeholder="9300675012345"/></div>
            <div style={{ gridColumn:"1/-1" }}><label className="lbl">DESCRIPTION *</label><input className="inp" value={form.description} onChange={e=>setForm(f=>({...f,description:e.target.value}))} placeholder="Product name"/></div>
            <div style={{ gridColumn:"1/-1" }}><label className="lbl">CATEGORY</label><input className="inp" value={form.category} onChange={e=>setForm(f=>({...f,category:e.target.value}))} placeholder="Category"/></div>
          </div>
          <div style={{ fontSize:12, color:G.muted, marginTop:8 }}>Barcode = scanner input · Product Code = manual search</div>
          <div style={{ display:"flex", gap:10, marginTop:14 }}>
            <button className="btn-amber" onClick={save}>SAVE</button>
            <button className="btn-ghost-sm" onClick={()=>{ setEditing(null); setAdding(false); }}>CANCEL</button>
          </div>
        </div>
      )}
      <div style={{ background:G.surface, borderRadius:8, overflow:"hidden", boxShadow:"0 1px 4px rgba(0,0,0,.07)" }}>
        <table style={{ width:"100%", borderCollapse:"collapse", fontSize:14 }}>
          <thead>
            <tr style={{ background:G.dark, color:"#fff" }}>
              {["PRODUCT CODE","BARCODE","DESCRIPTION","CATEGORY",""].map(h =>
                <th key={h} style={{ padding:"11px 14px", textAlign:"left", fontSize:11, fontWeight:700, letterSpacing:1 }}>{h}</th>
              )}
            </tr>
          </thead>
          <tbody>
            {filtered.map((p, i) => (
              <tr key={p.code} style={{ borderBottom:`1px solid ${G.border}`, background:i%2===0?"#fff":"#fafaf8" }}>
                <td style={{ padding:"12px 14px", fontFamily:"monospace", fontWeight:800, color:G.amber }}>{p.code}</td>
                <td style={{ padding:"12px 14px", fontFamily:"monospace", fontSize:13, color:G.muted }}>{p.barcode||"—"}</td>
                <td style={{ padding:"12px 14px", fontWeight:600 }}>{p.description}</td>
                <td style={{ padding:"12px 14px", color:G.muted }}>{p.category||"—"}</td>
                <td style={{ padding:"12px 14px" }}>
                  <div style={{ display:"flex", gap:6 }}>
                    <button className="btn-ghost-sm" onClick={()=>startEdit(p)}>EDIT</button>
                    <button className="btn-red-sm" onClick={()=>{ if(window.confirm(`Delete "${p.description}"?`)){ setProducts(prev=>prev.filter(x=>x.code!==p.code)); showToast(`${p.description} deleted`); addLog("PRODUCT_DELETE", p.description, session.username); } }}>DELETE</button>
                  </div>
                </td>
              </tr>
            ))}
            {filtered.length===0 && <tr><td colSpan={5} style={{ padding:24, textAlign:"center", color:G.muted }}>No products found</td></tr>}
          </tbody>
        </table>
      </div>
    </div>
  );
}

function AdminUsers({ users, setUsers, session, showToast }) {
  const [adding, setAdding] = useState(false);
  const [form, setForm] = useState({ username: "", password: "", name: "", role: "picker" });

  const addUser = () => {
    if (!form.username.trim() || !form.password.trim() || !form.name.trim()) { showToast("All fields required", "err"); return; }
    if (users[form.username]) { showToast("Username taken", "err"); return; }
    setUsers(u => ({ ...u, [form.username]: { ...form } }));
    showToast("User created");
    setAdding(false); setForm({ username: "", password: "", name: "", role: "picker" });

/* ── Admin: Settings ────────────────────────────────────────────────────── */
function AdminSettings({ locations, setLocations, showToast }) {
  const [maxProd, setMaxProd] = useState(2);
  const [rack, setRack] = useState("All");
  const racks = ["All", ...new Set(Object.values(locations).map(l => l.rack))];

  const applyToAll = () => {
    if (!window.confirm(`Set max products to ${maxProd} for ${rack === "All" ? "ALL locations" : `Rack ${rack}`}?`)) return;
    setLocations(prev => {
      const next = { ...prev };
      Object.keys(next).forEach(id => {
        if (rack === "All" || next[id].rack === rack) next[id] = { ...next[id], maxProducts: parseInt(maxProd) };
      });
      return next;
    });
    showToast(`Max products set to ${maxProd} for ${rack === "All" ? "all locations" : `Rack ${rack}`}`);
  };

  return (
    <div style={{ maxWidth: 540 }}>
      <div style={{ fontWeight: 800, fontSize: 22, marginBottom: 20 }}>⚙ SETTINGS</div>
      <div style={{ background: G.surface, borderRadius: 8, border: `1px solid ${G.border}`, padding: 24, marginBottom: 16 }}>
        <div style={{ fontWeight: 700, fontSize: 16, marginBottom: 6 }}>Location Capacity</div>

        <select className="sel" style={{ width: 160, marginBottom: 14 }} value={rack} onChange={e => setRack(e.target.value)}>

        </select>
